<meta charset="utf-8">
<meta name="theme-color" content="#08040C">
<!-- أيقونة الشاشة الرئيسية في نسخة الويب (الملفات جنب الصفحة على الموقع) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smoyz Safe">
<style>
/* ===== Smoyz Safe ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* ألوان مسحوبة من لوجو Smoyz الرسمي (smoyz-brand-kit/BRAND.md) */
  --bg:#08040C;
  --surface:#130E1D;
  --surface-2:#191225;
  --panel:#221930;
  --border-strong:#3D2F58;
  --line:#2B2140;
  --ink:#F0ECF7;
  --muted:#A093B8;
  --faint:#726389;
  --flame:#E1591E;
  --flame-hi:#ED8A24;
  --flame-glow:rgba(225,89,30,.38);
  --on-flame:#08040C;
  --cyan:#61A4D5;
  --violet:#AE07DB;
  --ok:#AED356;
  --amber:#F2A93B;
  --danger:#FF5B58;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",monospace;
  --z-fab:10; --z-nav:20; --z-sheet-bk:30; --z-sheet:31; --z-confirm-bk:40; --z-confirm:41; --z-toast:50;
}
html{font-size:16px}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 55% at 50% -10%, rgba(174,7,219,.16), transparent 70%);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:"Dubai","Cairo","Segoe UI",system-ui,Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
  min-height:100dvh;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;width:100%;font-size:16px;outline:none;
}
/* التكبير لفوق وتحت بس — الأفقي كان بيخرج برا الشاشة */
textarea{resize:vertical;max-width:100%;min-height:52px;max-height:40vh}
/* الكلام بياخد اتجاهه من أول حرف فيه: عربي من اليمين، إنجليزي من الشمال */
input:not(.ltr),textarea:not(.ltr){unicode-bidi:plaintext;text-align:start}
.row-t,.step-t,.dr-name,.wn-item,.dr-text{unicode-bidi:plaintext}
/* زرار مسح الكتابة كلها */
.clr{position:relative;display:block;width:100%}
.clr>input,.clr>textarea{padding-right:42px}
.clr-x{
  position:absolute;top:0;right:0;width:42px;height:48px;
  display:none;align-items:center;justify-content:center;color:var(--faint);
}
.clr-x svg{width:17px;height:17px}
.clr-x:active{color:var(--ink)}
.clr.on>.clr-x{display:flex}
.clr>textarea+.clr-x{height:46px}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--flame);box-shadow:0 0 0 3px rgba(225,89,30,.12)}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
::selection{background:var(--border-strong);color:var(--ink)}
svg{width:22px;height:22px;flex:none}
.ltr{direction:ltr;unicode-bidi:embed;text-align:left}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---- app frame ---- */
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.screen{flex:1;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---- gate screens ---- */
.gate{align-items:center;justify-content:center;padding:32px 24px;text-align:center;gap:0;overflow-y:auto}
/* لوجو Smoyz الرسمي — فيه الوهج بتاعه، فمش محتاج أي خلفية أو إطار */
.gate-logo{display:block;height:auto;margin:0 auto 10px;width:min(70%,230px)}
.gate-logo.sm{width:min(56%,186px);margin-bottom:4px}
.gate h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em;direction:ltr}
.gate .brand{
  font-size:.66rem;font-weight:600;letter-spacing:.34em;color:var(--faint);
  margin-top:6px;margin-bottom:30px;direction:ltr;
}
.gate form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:start}
.gate label{font-size:.85rem;color:var(--muted)}
.field{position:relative}
/* العين دايمًا على اليمين — عشان بداية الباسورد (من الشمال) متتغطاش */
.field input{padding-right:46px}
.field .peek{
  position:absolute;top:0;right:0;left:auto;height:100%;width:46px;
  display:flex;align-items:center;justify-content:center;color:var(--faint);
}
.field .peek:active{color:var(--ink)}
.btn{
  border-radius:var(--r-md);padding:13px 18px;font-weight:700;font-size:1rem;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:filter .15s, transform .1s, background .15s;
}
.btn:active{transform:scale(.985)}
.btn-flame{background:var(--flame);color:var(--on-flame)}
.btn-flame:hover{background:var(--flame-hi)}
.btn-flame:disabled{filter:saturate(.35) brightness(.75);cursor:default}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.warn-box{
  display:flex;gap:10px;align-items:flex-start;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;font-size:.85rem;color:var(--muted);line-height:1.65;
}
.warn-box svg{color:var(--amber);width:19px;height:19px;margin-top:2px}
.gate .aux{margin-top:22px;font-size:.85rem;color:var(--cyan);text-decoration:underline;text-underline-offset:3px}
.gate .lang-sw{margin-top:12px;font-size:.8rem;color:var(--faint)}
.gate-err{color:var(--danger);font-size:.85rem;min-height:1.2em}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(6px)}40%,80%{transform:translateX(-6px)}}

.meter{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:2px;background:var(--danger);transition:width .25s,background .25s}
.meter-lbl{font-size:.75rem;color:var(--faint);min-height:1em}

/* ---- main ---- */
#scr-main{padding-bottom:76px}
header.bar{
  position:sticky;top:0;z-index:var(--z-nav);
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 18px;display:flex;align-items:center;gap:12px;
}
.bar-mark{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center}
.bar-mark img{width:36px;height:36px;display:block}
.bar-t{flex:1;line-height:1.15}
.bar-t b{font-size:1.06rem;font-weight:800;display:block;direction:ltr;text-align:start}
.bar-t span{font-size:.6rem;letter-spacing:.3em;color:var(--faint);direction:ltr;display:block;text-align:start}
.bar-lock{width:42px;height:42px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--ink);background:rgba(255,255,255,.07)}
.bar-lock:active{background:rgba(255,255,255,.14)}

main#content{flex:1;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}

.row{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px 14px;cursor:pointer;
}
.row:active{background:var(--surface-2)}
.row-ic{
  width:40px;height:40px;border-radius:12px;background:var(--panel);
  display:flex;align-items:center;justify-content:center;color:var(--flame);flex:none;
}
.row-ic.cy{color:var(--cyan)}
.row-ic.vi{color:var(--violet)}
.row-ic svg{width:19px;height:19px}
.row-main{flex:1;min-width:0}
.row-t{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row-acts{display:flex;gap:4px;flex:none}
.icon-btn{
  width:40px;height:40px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.icon-btn:active{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.tool-btn{
  width:46px;height:46px;border-radius:var(--r-lg);flex:none;
  background:var(--surface);border:1px solid var(--line);color:var(--flame);
  display:flex;align-items:center;justify-content:center;
}
.tool-btn:active{background:var(--surface-2)}

.chip{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--r-sm);
  font-size:.7rem;font-weight:700;background:var(--panel);border:1px solid var(--border-strong);color:var(--ink);
  letter-spacing:.04em;direction:ltr;
}
.chip.meeza{letter-spacing:0}

.search{position:relative}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search input{padding-inline-start:44px;border-radius:var(--r-lg);background:var(--surface)}

/* money */
.mny-sum{
  display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 16px;font-size:.92rem;
}
.mny-sum .pos{color:var(--ok);font-weight:800}
.mny-sum .neg{color:var(--amber);font-weight:800}
.mny-sum small{color:var(--faint);font-weight:400;font-size:.78rem}
.amt-pos{color:var(--ok);font-weight:800}
.amt-neg{color:var(--amber);font-weight:800}
.row.settled{opacity:.45}
.row.settled .row-t{text-decoration:line-through}
.settle-btn{border:1.5px solid var(--line);color:var(--faint)}
.settle-btn.done{border-color:var(--ok);color:var(--ok);background:rgba(174,211,86,.10)}
.sec-h{
  font-size:.78rem;font-weight:700;color:var(--faint);letter-spacing:.02em;
  margin:8px 4px -2px;display:flex;align-items:center;gap:7px;
}
.sec-h svg{width:15px;height:15px}
.sec-act{
  margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;
  border:1px solid rgba(225,89,30,.45);background:rgba(225,89,30,.10);color:var(--flame);font-size:.78rem;font-weight:700;
}
.sec-act:active{background:rgba(225,89,30,.2)}
/* تذكير السلف: اختيار + معاينة الرسائل */
.dr-person,.dr-item{display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:var(--r-md);padding:10px 12px}
.dr-person{background:var(--surface-2);border:1px solid var(--line);margin-top:6px}
.dr-item{padding-inline-start:26px}
.dr-item:active,.dr-person:active{background:var(--surface-2)}
.dr-check{
  width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border-strong);
  display:grid;place-items:center;flex:none;color:transparent;
}
.dr-check svg{width:16px;height:16px}
.on>.dr-check{background:var(--flame);border-color:var(--flame);color:var(--on-flame)}
.dr-main{flex:1;min-width:0}
.dr-name{font-weight:800;font-size:.98rem}
.dr-sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-amt{font-weight:800;color:var(--ok);font-size:.95rem;flex:none}
.dr-msg{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px}
.dr-msg.sent{opacity:.6}
.dr-msg-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dr-sent{color:var(--ok);font-weight:700;font-size:.85rem}
.dr-text{
  white-space:pre-wrap;font-family:inherit;font-size:.88rem;line-height:1.75;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin:0;
  max-height:230px;overflow:auto;text-align:start;
}
.pay-banner{
  display:flex;gap:10px;align-items:center;
  background:rgba(242,169,59,.10);border:1px solid rgba(242,169,59,.4);border-radius:var(--r-lg);
  padding:11px 14px;font-size:.86rem;color:var(--amber);font-weight:600;line-height:1.5;
}
.pay-banner svg{width:19px;height:19px;flex:none}
.payout-banner{
  display:flex;gap:10px;align-items:center;
  background:rgba(174,211,86,.10);border:1px solid rgba(174,211,86,.45);border-radius:var(--r-lg);
  padding:11px 14px;font-size:.86rem;color:var(--ok);font-weight:700;line-height:1.5;
}
.payout-banner svg{width:19px;height:19px;flex:none}
.upd-banner{
  display:flex;gap:10px;align-items:center;width:100%;text-align:start;
  background:rgba(225,89,30,.10);border:1px solid rgba(225,89,30,.45);border-radius:var(--r-lg);
  padding:11px 14px;font-size:.86rem;color:var(--flame);font-weight:700;line-height:1.5;
}
.upd-banner svg{width:19px;height:19px;flex:none}
.upd-banner:active{background:rgba(225,89,30,.18)}
.prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:var(--cyan);border-radius:2px}
.turn-note{color:var(--ok);font-weight:700}
.late-note{color:var(--danger);font-weight:700}
.row-hi{font-size:.82rem;margin-top:3px;white-space:normal;line-height:1.5}

.empty{
  text-align:center;color:var(--faint);padding:56px 24px;display:flex;flex-direction:column;
  align-items:center;gap:12px;font-size:.92rem;line-height:1.7;
}
.empty svg{width:42px;height:42px;opacity:.4}

nav#tabs{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:var(--z-nav);
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav#tabs button{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 10px;color:var(--faint);font-size:.62rem;font-weight:600;position:relative;
}
nav#tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav#tabs button svg{width:20px;height:20px}
nav#tabs button.on{color:var(--flame)}
nav#tabs .dot{position:absolute;top:7px;inset-inline-start:calc(50% - 15px);width:7px;height:7px;border-radius:50%;background:var(--amber)}

#fab{
  position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));z-index:var(--z-fab);
  inset-inline-end:calc(50% - 240px + 18px);
  width:56px;height:56px;border-radius:18px;background:var(--flame);color:var(--on-flame);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 22px var(--flame-glow);
  transition:transform .12s;
}
@media (max-width:500px){#fab{inset-inline-end:18px}}
#fab:active{transform:scale(.93)}
#fab svg{width:25px;height:25px}
#fab.hide{display:none}

.set-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.set-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:start;
  border-bottom:1px solid var(--line);
}
.set-item:last-child{border-bottom:none}
.set-item:active{background:var(--surface-2)}
.set-item svg{width:20px;height:20px;color:var(--muted);flex:none}
.set-item .txt{flex:1;min-width:0}
.set-item .txt b{font-size:.94rem;font-weight:700;display:block}
.set-item .txt small{font-size:.78rem;color:var(--faint)}
.set-item select{width:auto;padding:8px 12px;font-size:.88rem;background:var(--surface-2)}
.set-item.danger .txt b,.set-item.danger svg{color:var(--danger)}
.sec-note{font-size:.8rem;color:var(--faint);line-height:1.8;padding:4px 6px}
.sec-note b{color:var(--muted)}

#sheet-bk{
  position:fixed;inset:0;background:rgba(5,7,8,.66);z-index:var(--z-sheet-bk);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
#sheet-bk.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);
  width:100%;max-width:480px;max-height:90dvh;z-index:var(--z-sheet);
  background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.16,1,.3,1);
}
#sheet.on{transform:translate(-50%,0)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:16px 18px 8px}
.sheet-h b{flex:1;font-size:1.06rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow-y:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
/* من غير دي بيتضغط المحتوى الطويل بدل ما يعمل تمرير */
.sheet-body>*{flex:none}
.sheet-body label{font-size:.83rem;color:var(--muted);margin-bottom:-6px}
.f-row{display:flex;gap:10px}
.f-row>*{flex:1}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:.92rem;color:var(--muted)}
.seg button.on-pos{background:rgba(174,211,86,.14);color:var(--ok)}
.seg button.on-neg{background:rgba(242,169,59,.14);color:var(--amber)}
.seg button.on-vi{background:rgba(174,7,219,.16);color:var(--violet)}
.type-pick{display:flex;flex-direction:column;gap:10px}
.type-pick button{
  display:flex;align-items:center;gap:12px;text-align:start;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;
}
.type-pick button:active{border-color:var(--flame)}
.type-pick-row b{display:block;font-size:.95rem}
.type-pick-row small{color:var(--faint);font-size:.76rem;line-height:1.5;display:block;margin-top:2px}
.type-pick .row-ic{width:38px;height:38px}
.type-pick b{display:block;font-size:.95rem}
.type-pick small{color:var(--faint);font-size:.78rem}
.gen-row{display:flex;align-items:center;gap:10px;color:var(--muted)}
.gen-row input[type=range]{flex:1;padding:0;background:none;border:none}
.gen-row input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--flame)}
.gen-row label{margin:0;font-size:.85rem}
.sheet-del{margin-top:4px}
.reveal-line{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;
}
.reveal-line .val{flex:1;font-size:.95rem;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
/* الأهداف */
.goal-head{display:flex;gap:10px;align-items:center}
.goal-head .prog{margin-top:0;flex:1}
.add-step{display:flex;gap:8px;align-items:center;margin-top:4px}
.step-t{font-weight:600;white-space:normal;font-size:.94rem;line-height:1.5}
.step-done .step-t{text-decoration:line-through;opacity:.45}
/* رسالة الجديد في التحديث */
.wn-item{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;font-size:.9rem;line-height:1.75;color:var(--ink);
}
.reveal-line .lbl{font-size:.75rem;color:var(--faint);flex:none}

#cf-bk{position:fixed;inset:0;background:rgba(5,7,8,.72);z-index:var(--z-confirm-bk);display:none;align-items:center;justify-content:center;padding:26px}
#cf-bk.on{display:flex}
#cf{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  width:100%;max-width:330px;padding:20px;display:flex;flex-direction:column;gap:12px;
}
#cf b{font-size:1rem}
#cf p{font-size:.87rem;color:var(--muted);line-height:1.7}
#cf .cf-btns{display:flex;gap:10px;margin-top:4px}
#cf .cf-btns .btn{flex:1;padding:11px;font-size:.92rem}

#toast{
  position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,16px);
  background:var(--panel);border:1px solid var(--border-strong);color:var(--ink);
  padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;
  z-index:var(--z-toast);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

.fade-in{animation:fadeIn .26s ease-out}

.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ================= تشفير ================= */
const enc=new TextEncoder(), dec=new TextDecoder();
function bufB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64Buf(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
const KDF_ITER=600000;
async function deriveKey(password,salt,iter){
  const km=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']
  );
}
async function encryptVault(key,obj,kdf){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return {v:1,kdf,cipher:{alg:'AES-256-GCM',iv:bufB64(iv),data:bufB64(ct)}};
}
async function decryptVault(key,blob){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64Buf(blob.cipher.iv)},key,b64Buf(blob.cipher.data));
  return JSON.parse(dec.decode(pt));
}

/* ================= قوة + توليد ================= */
function strength(pw){
  if(!pw) return {bits:0,label:'',color:'var(--danger)',pct:0};
  let pool=0;
  if(/[a-z]/.test(pw))pool+=26;
  if(/[A-Z]/.test(pw))pool+=26;
  if(/[0-9]/.test(pw))pool+=10;
  if(/[^a-zA-Z0-9]/.test(pw))pool+=32;
  const bits=Math.round(pw.length*Math.log2(pool||1));
  let label,color;
  if(bits<45){label=t('sWeak');color='var(--danger)'}
  else if(bits<70){label=t('sMid');color='var(--amber)'}
  else if(bits<95){label=t('sStrong');color='var(--ok)'}
  else{label=t('sPerfect');color='var(--ok)'}
  return {bits,label,color,pct:Math.min(100,Math.round(bits/110*100))};
}
function randInt(max){
  const lim=Math.floor(0x100000000/max)*max;
  const a=new Uint32Array(1);
  do{crypto.getRandomValues(a)}while(a[0]>=lim);
  return a[0]%max;
}
function genPassword(len,useUpper,useDigits,useSymbols){
  const lower='abcdefghijkmnopqrstuvwxyz';
  const upper='ABCDEFGHJKLMNPQRSTUVWXYZ';
  const digits='23456789';
  const symbols='!@#$%^&*-_=+?';
  let all=lower;const must=[lower];
  if(useUpper){all+=upper;must.push(upper)}
  if(useDigits){all+=digits;must.push(digits)}
  if(useSymbols){all+=symbols;must.push(symbols)}
  const out=[];
  must.forEach(set=>out.push(set[randInt(set.length)]));
  while(out.length<len)out.push(all[randInt(all.length)]);
  for(let i=out.length-1;i>0;i--){const j=randInt(i+1);[out[i],out[j]]=[out[j],out[i]]}
  return out.slice(0,len).join('');
}

/* -------- الفتح -------- */
function guardWait(){
  const g=loadGuard();
  return Math.max(0,Math.ceil((g.until-Date.now())/1000));
}
let guardTicker=null;
function tickGuard(){
  clearInterval(guardTicker);
  const btn=$('#lk-btn');
  const upd=()=>{
    const w=guardWait();
    if(w>0){btn.disabled=true;btn.textContent=t('lkWait',{n:w})}
    else{btn.disabled=false;btn.textContent=t('lkBtn');clearInterval(guardTicker)}
  };
  upd();guardTicker=setInterval(upd,1000);
}
async function unlockWith(pw,fromBio){
  if(guardWait()>0&&!fromBio)return;
  const err=$('#lk-err'), btn=$('#lk-btn');
  err.textContent='';
  btn.disabled=true;btn.innerHTML='<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+P.loader+'</svg> '+t('lkOpening');
  try{
    const blob=loadBlob();
    const key=await deriveKey(pw,b64Buf(blob.kdf.salt),blob.kdf.iter);
    vault=await decryptVault(key,blob);
    cryptoKey=key;
    if(!vault.settings)vault.settings={autolockMin:10,lockV2:true,lastExport:0};
    if(!vault.goals)vault.goals=[];
    if(!vault.places)vault.places=[];
    vault.money.forEach(m=>{if(!m.kind)m.kind='debt'});
    let migrated=false;
    /* القفل الافتراضي بقى 10 دقايق (كان 3) */
    if(!vault.settings.lockV2){
      if(!vault.settings.autolockMin||vault.settings.autolockMin===3)vault.settings.autolockMin=10;
      vault.settings.lockV2=true;migrated=true;
    }
    /* أقساط قديمة من غير "شهر أول قسط": نستنتجه بحيث حالتها الحالية ماتتغيرش */
    const mkNow=monthKey();
    vault.money.forEach(m=>{
      if((m.kind==='installment'||m.kind==='gamiya')&&!isYm(m.startMonth)){
        const paid=Number(m.monthsPaid)||0;
        const curIdx=(m.lastPaidMonth===mkNow)? Math.max(1,paid) : paid+1;
        m.startMonth=addMonths(mkNow,-(curIdx-1));
        migrated=true;
      }
    });
    if(migrated){try{await persist()}catch(e){}}
    saveGuard({n:0,until:0});
    $('#lk-pw').value='';
    btn.disabled=false;btn.textContent=t('lkBtn');
    openMain();
  }catch(ex){
    const g=loadGuard();g.n++;
    if(g.n>=3)g.until=Date.now()+Math.min(5*Math.pow(2,g.n-3),300)*1000;
    saveGuard(g);
    err.textContent=fromBio? t('bioFailed') : t('lkWrong')+(g.n>=3?t('lkDelay'):'');
    $('#lock-form').classList.add('shake');
    setTimeout(()=>$('#lock-form').classList.remove('shake'),450);
    btn.disabled=false;btn.textContent=t('lkBtn');
    tickGuard();
  }
}

const TABS=[

  {id:'cards',key:'tabCards',icon:'card'},

  {id:'places',key:'tabPlaces',icon:'pin'},

function needBackup(){
  if(!vault)return false;
  const items=vault.passwords.length+vault.cards.length+vault.money.length+(vault.goals?vault.goals.length:0)+(vault.places?vault.places.length:0);
  const last=(vault.settings&&vault.settings.lastExport)||0;
  return items>0&&(Date.now()-last>30*24*3600*1000);
}
/* حالة القسط/الجمعية في الشهر الحالي، محسوبة من شهر أول قسط:
   idx = رقم القسط المستحق الشهر ده (أقل من 1 = لسه مابدأش) */
function instState(m){
  const total=Number(m.monthsTotal)||0, paid=Number(m.monthsPaid)||0;
  const idx=isYm(m.startMonth)? ymIndex(monthKey())-ymIndex(m.startMonth)+1 : paid+1;
  const upcoming=idx<1;
  const covered=upcoming? paid>=1 : paid>=Math.min(idx,total);
  const overdue=upcoming? 0 : Math.max(0,Math.min(idx-1,total)-paid);
  return {idx,paid,total,upcoming,covered,overdue};
}
function pendingPayments(){
  if(!vault)return 0;
  return vault.money.filter(m=>{
    if((m.kind!=='installment'&&m.kind!=='gamiya')||m.settled)return false;
    const s=instState(m);
    return !s.upcoming&&!s.covered;
  }).length;
}
/* تواريخ الأقساط الجاية اللي لسه متدفعتش (سنة لقدام) — بتتبعت لأندرويد
   عشان المنبّه يفكّر في ميعادها بالظبط حتى والتطبيق مقفول */
function dueDatesAhead(){
  if(!vault)return [];
  const today=todayISO(), horizon=ymIndex(monthKey())+13, out=[];
  vault.money.forEach(m=>{
    if((m.kind!=='installment'&&m.kind!=='gamiya')||m.settled||!isYm(m.startMonth))return;
    const total=Number(m.monthsTotal)||0, paid=Number(m.monthsPaid)||0, start=ymIndex(m.startMonth);
    for(let n=paid+1;n<=total;n++){
      const mi=start+n-1;
      if(mi>horizon)break;
      const y=Math.floor(mi/12), mo=mi%12+1;
      const day=Math.min(new Date(y,mo,0).getDate(),Math.max(1,Number(m.dueDay)||1));
      const d=ymFromIndex(mi)+'-'+String(day).padStart(2,'0');
      if(d>=today)out.push(d);
    }
  });
  return [...new Set(out)].sort().slice(0,400);
}
/* مواعيد قبض الجمعيات الجاية — عشان المنبّه يفكّرك بيها زي الأقساط */
function payoutDatesAhead(){
  if(!vault)return [];
  const today=todayISO(), horizon=ymIndex(monthKey())+13, out=[];
  vault.money.forEach(m=>{
    if(m.kind!=='gamiya'||m.settled)return;
    const po=gamPayout(m);
    if(!po.month||ymIndex(po.month)>horizon)return;
    const [y,mo]=po.month.split('-').map(Number);
    const day=Math.min(new Date(y,mo,0).getDate(),Math.max(1,Number(m.dueDay)||1));
    const d=po.month+'-'+String(day).padStart(2,'0');
    if(d>=today)out.push(d);
  });
  return [...new Set(out)].sort().slice(0,50);
}
function reminderSync(){
  if(!window.Khazna||!vault)return;
  const now=pendingPayments()>0;
  try{
    if(window.Khazna.setReminderPlan)window.Khazna.setReminderPlan(dueDatesAhead().join(','),now,lang);
    else if(window.Khazna.setMonthlyReminder)window.Khazna.setMonthlyReminder(now,lang);
    if(window.Khazna.setPayoutDates)window.Khazna.setPayoutDates(payoutDatesAhead().join(','));
  }catch(e){}
}

let updAvailable=null;
let updSilent=false;
function updUrl(){return ((vault&&vault.settings&&vault.settings.updateUrl)||DEFAULT_UPDATE_URL).trim()}
/* ---- نسخة احتياطية تلقائية كل 30 يوم ---- */
const AUTO_BK_DAYS=30;
function autoBackupFolder(){
  if(!window.Khazna||!window.Khazna.backupFolder)return null; /* نسخة الويب */
  try{return window.Khazna.backupFolder()||''}catch(e){return ''}
}
window.__khaznaBackupFolder=name=>{
  if(!vault)return;
  vault.settings.autoBackup=!!name;
  if(name)vault.settings.lastAutoBackup=0;
  persist().then(()=>{
    if(currentTab==='set')renderTab();
    if(name)maybeAutoBackup(true);
  });
};
window.__khaznaAutoBackupDone=ok=>{
  if(!vault)return;
  if(!ok){toast(t('autoBkFail'));return}
  const now=Date.now();
  vault.settings.lastAutoBackup=now;
  vault.settings.lastExport=now; /* بقى عندك نسخة فعلًا */
  persist().then(()=>{renderTabs();if(currentTab==='set')renderTab()});
  toast(t('autoBkDone'));
};
function maybeAutoBackup(force){
  if(!vault||!window.Khazna||!window.Khazna.autoBackup)return;
  if(!autoBackupFolder())return;
  const last=vault.settings.lastAutoBackup||0;
  if(!force&&Date.now()-last<AUTO_BK_DAYS*24*3600*1000)return;
  const blob=loadBlob();if(!blob)return;
  const d=new Date();
  const name='smoyz-safe-auto-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
  try{window.Khazna.autoBackup(JSON.stringify(blob),name)}catch(e){}
}
function maybeAutoCheckUpdate(){
  if(!window.Khazna||!window.Khazna.checkUpdate||!vault)return;
  const u=updUrl();if(!u)return;
  const last=vault.settings.lastUpdateCheck||0;
  if(Date.now()-last<24*3600*1000)return;
  vault.settings.lastUpdateCheck=Date.now();persist();
  updSilent=true;
  window.Khazna.checkUpdate(APP_VCODE,u);
}
window.__khaznaUpdateState=async o=>{
  const st=o.state, info=o.info||'', el=$('#upd-status'), silent=updSilent;
  if(st==='checking'){if(el&&!silent)el.textContent=t('updChecking');return}
  if(st==='available'){
    updSilent=false;updAvailable=info;
    if(vault){
      /* بيتحفظ عشان البانر يفضل ظاهر حتى لو قفل التطبيق وفتحه تاني */
      vault.settings.updAvail={v:info,code:Number(o.code)||(APP_VCODE+1)};
      await persist();
      renderTabs();renderTab();
    }
    const yes=await confirmDlg(t('updT'),t('updMsg',{v:info,c:APP_VERSION}),{yesLabel:t('updGo')});
    if(yes&&window.Khazna)window.Khazna.installUpdate();
    return;
  }
  updSilent=false;
  if(silent)return;
  if(!el)return;
  if(st==='none')el.textContent=t('updNone',{v:APP_VERSION});
  else if(st==='downloading')el.textContent=t('updDl');
  else if(st==='installing')el.textContent=t('updInstalling');
  else if(st==='needPermission')el.textContent=t('updPerm');
  else if(st==='error')el.textContent=t('updErr')+(info||t('updTryAgain'));
};

function renderTabs(){
  $('#tabs').innerHTML=TABS.map(tb=>
    '<button data-tab="'+tb.id+'" class="'+(currentTab===tb.id?'on':'')+'" aria-label="'+t(tb.key)+'">'+
    ((tb.id==='set'&&(needBackup()||updAvailable))||(tb.id==='money'&&pendingPayments()>0)?'<span class="dot"></span>':'')+
    ic(tb.icon)+'<span>'+t(tb.key)+'</span></button>').join('');
}
function openMain(){
  currentTab='pw';
  lastActivity=Date.now(); /* الفتح بالبصمة مافيهوش كتابة، فلازم نبدأ العداد من هنا */
  show('#scr-main');
  $('#scr-main').classList.add('fade-in');
  /* تحديث اتعرف عليه قبل كده ولسه متثبتش → فضل منبّه */
  const ua=vault.settings&&vault.settings.updAvail;
  if(ua&&Number(ua.code)>APP_VCODE)updAvailable=ua.v;
  else if(ua){updAvailable=null;delete vault.settings.updAvail;persist()}
  renderTabs();renderTab();
  maybeAutoCheckUpdate();
  reminderSync();
  maybeAutoBackup(false);
  maybeWhatsNew();
}

const LS_SEEN='smoyz.safe.seenver';
function maybeWhatsNew(){

  try{seen=localStorage.getItem(LS_SEEN)}catch(e){}
  if(seen===APP_VERSION)return;
  try{localStorage.setItem(LS_SEEN,APP_VERSION)}catch(e){}
  if(!seen)return; /* تثبيت جديد — مفيش "جديد" يتعرض */
  const entry=CHANGELOG[APP_VERSION];
  const items=entry&&(entry[lang]||entry.ar);
  if(!items||!items.length)return;

}

/* ================= الأهداف ================= */
const goalPct=g=>g.steps.length? Math.round(g.steps.filter(s=>s.done).length/g.steps.length*100):0;
const goalComplete=g=>g.steps.length>0&&g.steps.every(s=>s.done);
function bucketLabel(g,n){return g.div==='month'? t('goMonthN',{n}) : t('goWeekN',{n})}
function nextBucket(g){
  if(!g.steps.length)return 1;
  return Math.max.apply(null,g.steps.map(s=>Number(s.bucket)||1));
}
function renderGoals(c){
  if(!vault.goals.length){
    c.innerHTML='<div class="empty">'+ic('target')+'<span>'+t('goalsEmpty')+'</span></div>';
    return;
  }
  const list=[...vault.goals].sort((a,b)=>(goalComplete(a)?1:0)-(goalComplete(b)?1:0)||(b.createdAt||0)-(a.createdAt||0));
  c.innerHTML=list.map(g=>{
    const pct=goalPct(g), dn=g.steps.filter(s=>s.done).length;
    return '<div class="row'+(goalComplete(g)?' settled':'')+'" data-act="open-goal" data-id="'+g.id+'">'+
      '<div class="row-ic vi">'+ic('target')+'</div>'+
      '<div class="row-main"><div class="row-t">'+esc(g.title)+'</div>'+
      '<div class="row-s">'+t('goStepsProg',{a:dn,b:g.steps.length})+(g.div!=='none'?' · '+(g.div==='month'?t('goDivMonth'):t('goDivWeek')):'')+(g.note?' · '+esc(g.note):'')+'</div>'+
      '<div class="prog"><i style="width:'+pct+'%;background:'+(pct===100?'var(--ok)':'var(--violet)')+'"></i></div></div>'+
      '<span class="num" style="font-size:.92rem;font-weight:800;color:'+(pct===100?'var(--ok)':'var(--muted)')+'">'+pct+'%</span>'+
    '</div>';
  }).join('');
}

/* شاشة الهدف: النقط + علّم على اللي خلص + ضيف نقطة */
function openGoalView(id){
  const g=vault.goals.find(x=>x.id===id);if(!g)return;
  openSheet(g.title,'');
  paintGoal(g);
}
function stepRow(s){
  return '<div class="row'+(s.done?' step-done':'')+'" style="padding:10px 12px">'+
    '<button class="icon-btn settle-btn'+(s.done?' done':'')+'" data-gact="toggle" data-gid="'+s.id+'">'+ic('check')+'</button>'+
    '<div class="row-main"><div class="step-t">'+esc(s.text)+'</div></div>'+
    '<button class="icon-btn" data-gact="del" data-gid="'+s.id+'">'+ic('trash')+'</button>'+
  '</div>';
}
function paintGoal(g){
  const pct=goalPct(g), dn=g.steps.filter(s=>s.done).length;
  let html='<div class="goal-head">'+
    '<div class="prog"><i style="width:'+pct+'%;background:'+(pct===100?'var(--ok)':'var(--violet)')+'"></i></div>'+
    '<b class="num" style="color:'+(pct===100?'var(--ok)':'var(--violet)')+'">'+dn+'/'+g.steps.length+'</b></div>';
  if(!g.steps.length){
    html+='<div class="sec-note" style="text-align:center">'+t('goNoSteps')+'</div>';
  }else if(g.div==='none'){
    html+=g.steps.map(stepRow).join('');
  }else{
    const buckets=[...new Set(g.steps.map(s=>Number(s.bucket)||1))].sort((a,b)=>a-b);
    buckets.forEach(b=>{
      html+='<div class="sec-h">'+ic('cal')+bucketLabel(g,b)+'</div>';
      html+=g.steps.filter(s=>(Number(s.bucket)||1)===b).map(stepRow).join('');
    });
  }
  html+='<div class="add-step">'+
    '<input id="gs-text" placeholder="'+esc(t('goAddStep'))+'" autocomplete="off" style="flex:1">'+
    (g.div!=='none'?'<input id="gs-bucket" type="number" inputmode="numeric" min="1" max="99" class="ltr num" value="'+nextBucket(g)+'" style="width:62px;flex:none;padding:12px 8px;text-align:center">':'')+
    '<button class="tool-btn" id="gs-add">'+ic('plus')+'</button>'+
  '</div>'+
  '<button class="btn btn-ghost" id="g-edit">'+ic('sliders')+' '+t('goEditBtn')+'</button>';
  $('#sheet-body').innerHTML=html;
  addClearButtons($('#sheet-body'));

  $('#sheet-body').querySelectorAll('[data-gact="toggle"]').forEach(b=>b.addEventListener('click',async()=>{
    const s=g.steps.find(x=>x.id===b.dataset.gid);if(!s)return;
    s.done=!s.done;
    await persist();
    const done=goalComplete(g);
    paintGoal(g);renderTab();renderTabs();
    if(done&&s.done)toast(t('goDone'));
  }));
  $('#sheet-body').querySelectorAll('[data-gact="del"]').forEach(b=>b.addEventListener('click',async()=>{
    g.steps=g.steps.filter(x=>x.id!==b.dataset.gid);
    await persist();paintGoal(g);renderTab();
  }));
  const addStep=async()=>{
    const el=$('#gs-text'), txt=el.value.trim();
    if(!txt)return;
    const bkEl=$('#gs-bucket');
    const bk=bkEl? Math.min(99,Math.max(1,Number(bkEl.value)||1)) : 1;
    g.steps.push({id:uid(),text:txt,done:false,bucket:bk});
    await persist();paintGoal(g);renderTab();renderTabs();
    const n=$('#gs-text');if(n)n.focus();
  };
  $('#gs-add').addEventListener('click',addStep);
  $('#gs-text').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addStep()}});
  $('#g-edit').addEventListener('click',()=>openGoalForm(g.id));
}

      vault.goals.push(ng);
      await persist();renderTab();renderTabs();toast(t('saved'));
      openGoalView(ng.id); // يفتح على طول عشان يضيف النقط
    }

    vault.goals=vault.goals.filter(x=>x.id!==g.id);

  });
}

/* -------- الفلوس -------- */
function moneyTotals(){
  const tt={};
  vault.money.filter(m=>m.kind==='debt'&&!m.settled).forEach(m=>{
    const cur=m.currency||defCur();
    tt[cur]=tt[cur]||{pos:0,neg:0};
    if(m.dir==='lya')tt[cur].pos+=Number(m.amount)||0;
    else tt[cur].neg+=Number(m.amount)||0;
  });
  return tt;
}
/* قبض الجمعية: الإجمالي = القسط × عدد الشهور، والصافي بعد خصم قسط شهر القبض */
function gamPayout(m){
  const monthly=Number(m.monthly)||0, total=Number(m.monthsTotal)||0, turn=Number(m.myTurn)||0;
  const cur=m.currency||defCur();
  const gross=monthly*total;
  return {
    monthly,cur,gross,net:Math.max(0,gross-monthly),
    grossS:fmtAmt(gross)+' '+cur, netS:fmtAmt(gross-monthly)+' '+cur, monthlyS:fmtAmt(monthly)+' '+cur,
    month:(isYm(m.startMonth)&&turn>=1&&turn<=total)?addMonths(m.startMonth,turn-1):null
  };
}
const gamPayoutNow=m=>m.kind==='gamiya'&&!m.settled&&gamPayout(m).month===monthKey();
function instRow(m){
  const s=instState(m);
  const isGam=m.kind==='gamiya';
  const turn=isGam&&!m.settled&&!s.upcoming&&s.idx===Number(m.myTurn||0);
  const pct=Math.min(100,Math.round((s.paid/(s.total||1))*100));
  let sub=esc(m.funder||'')+(m.funder?' · ':'')+fmtAmt(Number(m.monthly)||0)+' '+esc(m.currency||defCur())+t('perMonth')+
    ' · '+t('monthsProg',{a:s.paid,b:s.total});
  if(s.upcoming&&!m.settled)sub+=' · '+t('startsOn',{m:esc(fmtMonth(m.startMonth))});
  else if(m.dueDay)sub+=' · '+t('dueDayS',{n:m.dueDay});
  /* السطر ده لوحده عشان المبلغ مايتقصّش */
  let hi='';
  if(s.overdue>0&&!m.settled)hi+='<span class="late-note">'+t('lateN',{n:s.overdue})+'</span>';
  if(isGam){
    const po=gamPayout(m);
    if(turn)hi+=(hi?' · ':'')+'<span class="turn-note">'+esc(t('gamTurnRow',{n:po.netS}))+'</span>';
    else if(!m.settled&&po.gross>0)sub+=' · '+esc(t('gamPayoutShort',{g:po.grossS}));
  }
  if(hi)hi='<div class="row-hi">'+hi+'</div>';
  return '<div class="row'+(m.settled?' settled':'')+'" data-act="open-money" data-id="'+m.id+'">'+
    '<button class="icon-btn settle-btn'+(s.covered?' done':'')+'" data-act="pay-month" data-id="'+m.id+'" aria-label="'+t('payThis')+'">'+ic('check')+'</button>'+
    '<div class="row-main"><div class="row-t">'+esc(m.title)+'</div>'+
    '<div class="row-s">'+sub+'</div>'+hi+
    '<div class="prog"><i style="width:'+pct+'%"></i></div></div>'+
    '<div class="row-ic '+(isGam?'vi':'cy')+'" style="width:34px;height:34px">'+ic(isGam?'users':'cal')+'</div>'+
  '</div>';
}

function renderMoney(c){
  const mk=monthKey();
  const monthOf=d=>(d||'').slice(0,7);
  const pend=pendingPayments();
  const tt=moneyTotals();
  const curs=Object.keys(tt);
  let html='';
  if(pend>0)html+='<div class="pay-banner">'+ic('bell')+'<span>'+t('payBanner',{n:pend})+'</span></div>';
  /* قبض جمعية الشهر ده */
  const payNow=vault.money.filter(gamPayoutNow);
  if(payNow.length){
    const po=gamPayout(payNow[0]);
    html+='<div class="payout-banner">'+ic('cash')+'<span>'+
      esc(payNow.length===1?t('gamBannerOne',{x:payNow[0].title,n:po.netS}):t('gamBannerN',{k:payNow.length}))+
    '</span></div>';
  }
  const exps=vault.money.filter(m=>m.kind==='expense');
  const savs=vault.money.filter(m=>m.kind==='saving');
  /* ملخص الشهر الحالي: صرفت كام وحوّشت كام */
  const ms={};
  exps.filter(e=>monthOf(e.date)===mk).forEach(e=>{const cu=e.currency||defCur();ms[cu]=ms[cu]||{sp:0,sv:0};ms[cu].sp+=Number(e.amount)||0});
  savs.filter(e=>monthOf(e.date)===mk).forEach(e=>{const cu=e.currency||defCur();ms[cu]=ms[cu]||{sp:0,sv:0};ms[cu].sv+=Number(e.amount)||0});
  if(Object.keys(ms).length){
    html+='<div class="mny-sum num"><small>'+t('thisMonth')+'</small>'+Object.keys(ms).map(cu=>
      '<span><small>'+t('spentW')+'&nbsp;</small><span class="neg">'+fmtAmt(ms[cu].sp)+' '+esc(cu)+'</span></span>'+
      '<span><small>'+t('savedW')+'&nbsp;</small><span class="pos">'+fmtAmt(ms[cu].sv)+' '+esc(cu)+'</span></span>'
    ).join('')+'</div>';
  }
  if(curs.length){
    html+='<div class="mny-sum num">'+curs.map(cur=>
      '<span><small>'+t('forYou')+'&nbsp;</small><span class="pos">'+fmtAmt(tt[cur].pos)+' '+esc(cur)+'</span></span>'+
      '<span><small>'+t('youOwe')+'&nbsp;</small><span class="neg">'+fmtAmt(tt[cur].neg)+' '+esc(cur)+'</span></span>'
    ).join('')+'</div>';
  }
  const debts=vault.money.filter(m=>m.kind==='debt').sort((a,b)=>(a.settled?1:0)-(b.settled?1:0)||(b.date||'').localeCompare(a.date||''));
  const insts=vault.money.filter(m=>m.kind==='installment').sort((a,b)=>(a.settled?1:0)-(b.settled?1:0));
  const gams=vault.money.filter(m=>m.kind==='gamiya').sort((a,b)=>(a.settled?1:0)-(b.settled?1:0));
  if(!debts.length&&!insts.length&&!gams.length&&!exps.length&&!savs.length){
    c.innerHTML='<div class="empty">'+ic('cash')+'<span>'+t('moneyEmpty')+'</span></div>';
    return;
  }
  if(insts.length)html+='<div class="sec-h">'+ic('cal')+t('secInst')+'</div>'+insts.map(instRow).join('');
  if(gams.length)html+='<div class="sec-h">'+ic('users')+t('secGam')+'</div>'+gams.map(instRow).join('');
  if(exps.length){
    html+='<div class="sec-h">'+ic('bag')+t('secExp')+'</div>';
    const curExp=exps.filter(e=>monthOf(e.date)===mk).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    html+=curExp.map(expRow).join('');
    const past={};
    exps.filter(e=>monthOf(e.date)!==mk).forEach(e=>{const k2=monthOf(e.date)||'?';(past[k2]=past[k2]||[]).push(e)});
    Object.keys(past).sort().reverse().forEach(k2=>{
      const tot={};past[k2].forEach(e=>{const cu=e.currency||defCur();tot[cu]=(tot[cu]||0)+(Number(e.amount)||0)});
      html+='<div class="row" data-act="toggle-month" data-id="'+k2+'" style="opacity:.75">'+
        '<div class="row-main"><div class="row-t">'+esc(fmtMonth(k2))+'</div></div>'+
        '<span class="num amt-neg" style="font-size:.92rem">−'+Object.keys(tot).map(cu=>fmtAmt(tot[cu])+' '+esc(cu)).join(' · −')+'</span>'+
      '</div>';
      if(expandedMonths.has(k2))html+=past[k2].slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(expRow).join('');
    });
  }
  if(savs.length){
    const tot={};savs.forEach(e=>{const cu=e.currency||defCur();tot[cu]=(tot[cu]||0)+(Number(e.amount)||0)});
    html+='<div class="sec-h">'+ic('save')+t('secSav')+'<span class="num" style="margin-inline-start:auto;color:var(--ok);font-weight:800">'+Object.keys(tot).map(cu=>fmtAmt(tot[cu])+' '+esc(cu)).join(' · ')+'</span></div>';
    html+=savs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(savRow).join('');
  }
  if(debts.length){
    const canRemind=debts.some(m=>m.dir==='lya'&&!m.settled);
    html+='<div class="sec-h">'+ic('cash')+t('secDebts')+
      (canRemind?'<button class="sec-act" data-act="debt-remind">'+ic('share')+t('drBtn')+'</button>':'')+
    '</div>'+debts.map(m=>{
      const pos=m.dir==='lya';
      return '<div class="row'+(m.settled?' settled':'')+'" data-act="open-money" data-id="'+m.id+'">'+
        '<button class="icon-btn settle-btn'+(m.settled?' done':'')+'" data-act="settle" data-id="'+m.id+'" aria-label="'+t('settledDone')+'">'+ic('check')+'</button>'+
        '<div class="row-main"><div class="row-t">'+esc(m.person)+'</div>'+
        '<div class="row-s">'+(pos?t('forYou'):t('youOwe'))+(m.date?' · '+fmtDate(m.date):'')+(m.note?' · '+esc(m.note):'')+
          (pos&&!m.settled&&m.remindedAt?' · '+t('drReminded',{d:fmtDate(m.remindedAt)}):'')+'</div></div>'+
        '<span class="num '+(pos?'amt-pos':'amt-neg')+'" style="font-size:1.02rem">'+(pos?'':'−')+fmtAmt(Number(m.amount)||0)+' <small style="font-weight:400;font-size:.72rem">'+esc(m.currency||defCur())+'</small></span>'+
      '</div>';
    }).join('');
  }
  c.innerHTML=html;
}

/* زرار × في كل خانة كتابة — يمسح المكتوب كله مرة واحدة */
function addClearButtons(root){
  if(!root)return;
  root.querySelectorAll('input[type="text"],input[type="url"],input[type="search"],input[type="email"],input:not([type]),textarea')
    .forEach(el=>{
      if(el.closest('.field')||el.closest('.clr'))return; /* خانات الباسورد فيها زرار العين */
      const w=document.createElement('span');
      w.className='clr';
      el.parentNode.insertBefore(w,el);
      w.appendChild(el);
      const b=document.createElement('button');
      b.type='button';b.className='clr-x';b.innerHTML=ic('x');
      b.setAttribute('aria-label',t('clearField'));
      w.appendChild(b);
      const upd=()=>w.classList.toggle('on',!!el.value);
      el.addEventListener('input',upd);
      b.addEventListener('click',()=>{
        el.value='';
        el.dispatchEvent(new Event('input',{bubbles:true}));
        upd();el.focus();
      });
      upd();
    });
}
function openSheet(title,bodyHTML){
  $('#sheet-title').textContent=title;
  $('#sheet-body').innerHTML=bodyHTML;
  addClearButtons($('#sheet-body'));
  $('#sheet-bk').classList.add('on');
  $('#sheet').classList.add('on');
}
function closeSheet(){
  $('#sheet-bk').classList.remove('on');
  $('#sheet').classList.remove('on');
  setTimeout(()=>{if(!$('#sheet').classList.contains('on'))$('#sheet-body').innerHTML=''},300);
}
$('#sheet-x').addEventListener('click',closeSheet);
$('#sheet-bk').addEventListener('click',closeSheet);

});

function coordsFromUrl(u){
  const s=String(u||'');
  const pats=[/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,/[?&](?:q|ll|daddr|destination|center)=(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/i,
    /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/^\s*(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)\s*$/];
  for(const re of pats){
    const m=s.match(re);
    if(m){
      const la=Number(m[1]),ln=Number(m[2]);
      if(Math.abs(la)<=90&&Math.abs(ln)<=180)return{lat:la,lng:ln};
    }
  }
  return null;
}
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
/* طلب الموقع من أندرويد (GPS بس، من غير أي اتصال) أو من المتصفح في نسخة الويب */
function getLocation(){
  return new Promise(res=>{
    let done=false;
    const finish=r=>{if(!done){done=true;res(r)}};
    if(window.Khazna&&window.Khazna.getLocation){
      window.__khaznaLocation=r=>{window.__khaznaLocation=null;finish(r||{ok:false})};
      try{window.Khazna.getLocation()}catch(e){finish({ok:false})}
      setTimeout(()=>finish({ok:false,err:'timeout'}),45000);
      return;
    }
    if(!navigator.geolocation){finish({ok:false});return}
    navigator.geolocation.getCurrentPosition(
      p=>finish({ok:true,lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>finish({ok:false,err:e&&e.code===1?'perm':'fail'}),
      {enableHighAccuracy:true,timeout:30000,maximumAge:60000});
  });
}
function openPlaceMap(p){
  const c=hasCoords(p)?{lat:Number(p.lat),lng:Number(p.lng)}:coordsFromUrl(p.url);
  if(c){
    if(window.Khazna&&window.Khazna.openMap){
      try{window.Khazna.openMap(String(c.lat),String(c.lng),p.name||'');return}catch(e){}
    }
    openExternal('https://www.google.com/maps/search/?api=1&query='+c.lat+','+c.lng);
    return;
  }
  const u=safeUrl(p.url);
  if(u)openExternal(u);else toast(t('plNeedAny'));
}
/* اختيار تطبيق الوصول: خرايط/ملاحة أو تطبيق نقل ذكي */
function openPlaceGo(p){
  const c=hasCoords(p)?{lat:Number(p.lat),lng:Number(p.lng)}:coordsFromUrl(p.url);
  if(!c){const u=safeUrl(p.url);if(u)openExternal(u);else toast(t('plNeedAny'));return}
  const la=String(c.lat), ln=String(c.lng), nm=p.name||'';
  let apps=[];
  if(window.Khazna&&window.Khazna.mapApps){
    try{apps=JSON.parse(window.Khazna.mapApps()||'[]')}catch(e){apps=[]}
  }
  const row=(label,sub,act,icon,color)=>
    '<button class="type-pick-row" data-go="'+act+'">'+
      '<span class="row-ic" style="color:'+(color||'var(--cyan)')+'">'+ic(icon)+'</span>'+
      '<span class="dr-main"><b>'+esc(label)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</span>'+
    '</button>';
  const maps=apps.filter(a=>a.kind==='geo'), rides=apps.filter(a=>a.kind==='ride');
  let html='';
  if(!window.Khazna){
    html+='<div class="type-pick">'+
      row('Google Maps','','web-gmaps','nav','var(--cyan)')+
      row('Uber','','web-uber','nav','var(--ink)')+
    '</div>';
  }else{
    if(maps.length){
      html+='<div class="sec-h">'+ic('nav')+t('plMapApps')+'</div><div class="type-pick">'+
        maps.map((a,i)=>row(a.label,'','m'+i,'nav','var(--cyan)')).join('')+'</div>';
    }
    if(rides.length){
      html+='<div class="sec-h">'+ic('pin')+t('plRideApps')+'</div><div class="type-pick">'+
        rides.map((a,i)=>row(a.label,a.mode==='copy'?t('plRideHint'):'','r'+i,'nav','var(--flame)')).join('')+'</div>';
    }
    if(!maps.length&&!rides.length)html+='<div class="warn-box">'+ic('alert')+'<span>'+t('plNoApps')+'</span></div>';
  }
  if(safeUrl(p.url))html+='<button class="btn btn-ghost" data-go="link">'+ic('link')+' '+t('plOpenLink')+'</button>';
  html+='<button class="btn btn-ghost" data-go="copy">'+ic('copy')+' '+t('plCopyCoords')+'</button>';
  openSheet(t('plGoT',{x:nm}),html);
  $('#sheet-body').querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
    const g=b.dataset.go;
    if(g==='copy'){
      const txt=la+','+ln;
      if(window.Khazna&&window.Khazna.copyCoords){try{window.Khazna.copyCoords(txt)}catch(e){}toast(t('plCoordsCopied'))}
      else copyText(txt,{label:t('plCoordsCopied')});
      closeSheet();return;
    }
    if(g==='link'){openExternal(p.url);closeSheet();return}
    if(g==='web-gmaps'){openExternal('https://www.google.com/maps/search/?api=1&query='+la+','+ln);closeSheet();return}
    if(g==='web-uber'){openExternal('https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[latitude]='+la+'&dropoff[longitude]='+ln+'&dropoff[nickname]='+encodeURIComponent(nm));closeSheet();return}
    const list=g[0]==='m'?maps:rides, a=list[Number(g.slice(1))];
    if(a){try{window.Khazna.openInApp(a.pkg,a.kind,a.mode||'',la,ln,nm)}catch(e){}}
    closeSheet();
  }));
}
function openExternal(url){
  const u=safeUrl(url);
  if(!u)return;
  if(window.Khazna&&window.Khazna.openUrl){
    try{window.Khazna.openUrl(u);return}catch(e){}
  }
  window.open(u,'_blank','noopener');
}
function renderPlaces(c){
  if(!vault.places.length){
    c.innerHTML='<div class="empty">'+ic('pin')+'<span>'+t('placesEmpty')+'</span></div>';
    return;
  }
  const list=[...vault.places].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  c.innerHTML=list.map(p=>{
    const bits=[];
    if(p.note)bits.push(esc(p.note));
    if(hasCoords(p))bits.push('<span class="ltr num">'+fmtCoord(p.lat)+', '+fmtCoord(p.lng)+'</span>');
    else if(safeUrl(p.url))bits.push(t('plHasLink'));
    return '<div class="row" data-act="open-place" data-id="'+p.id+'">'+
      '<div class="row-ic">'+ic('pin')+'</div>'+
      '<div class="row-main"><div class="row-t">'+esc(p.name)+'</div>'+
      '<div class="row-s">'+bits.join(' · ')+'</div></div>'+
      '<button class="icon-btn" data-act="nav-place" data-id="'+p.id+'" aria-label="'+t('plOpen')+'" style="color:var(--cyan)">'+ic('nav')+'</button>'+
    '</div>';
  }).join('');
}

  );
  let fromLink=false;
  const paint=()=>{
    $('#pl-pin-t').textContent=(lat!==null)?t('plPinAgain'):t('plPin');

      ? '<span style="color:var(--ok)">'+(fromLink?t('plFromLink'):t('plPinned'))+'</span> <span class="ltr num">'+fmtCoord(lat)+', '+fmtCoord(lng)+'</span>'
      : '';

    const yes=await confirmDlg(t('delPwT',{x:p.name}),t('delMsg'),{danger:true,yesLabel:t('delBtn')});
    if(!yes)return;
    vault.places=vault.places.filter(x=>x.id!==p.id);
    await persist();closeSheet();renderTab();renderTabs();toast(t('deleted'));
  });
}

/* -------- تذكير السلف: اختيار سلفة أو أكتر → رسالة جاهزة لكل شخص -------- */
function groupByPerson(items){
  const map=new Map();
  items.forEach(m=>{
    const name=String(m.person||'').trim(), k=name.toLowerCase();
    if(!map.has(k))map.set(k,{name,items:[]});
    map.get(k).items.push(m);
  });
  return [...map.values()].map(g=>({name:g.name,items:g.items.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''))}));
}
function debtTotalsStr(items){
  const tot={};
  items.forEach(m=>{const cu=m.currency||defCur();tot[cu]=(tot[cu]||0)+(Number(m.amount)||0)});
  return Object.keys(tot).map(cu=>fmtAmt(tot[cu])+' '+cu).join(' + ');
}
function debtLine(m){
  return '• '+fmtAmt(Number(m.amount)||0)+' '+(m.currency||defCur())+
    (m.note?' — '+m.note:'')+(m.date?' ('+fmtDate(m.date)+')':'');
}
function debtReminderText(g){
  return t('msgHi',{x:g.name})+'\n'+
    (g.items.length>1?t('msgMany'):t('msgOne'))+'\n\n'+
    g.items.map(debtLine).join('\n')+
    (g.items.length>1?'\n\n'+t('msgTotal',{v:debtTotalsStr(g.items)}):'')+
    '\n\n'+t('msgThanks');
}
function debtReminderCombined(groups){
  return t('msgGroupHead')+'\n\n'+
    groups.map(g=>g.name+':\n'+g.items.map(debtLine).join('\n')+
      (g.items.length>1?'\n'+t('msgTotal',{v:debtTotalsStr(g.items)}):'')).join('\n\n')+
    '\n\n'+t('msgThanks');
}
/* المشاركة بتسلّم النص لواتساب أو أي تطبيق — التطبيق نفسه مابيتصلش بحاجة */
async function shareText(txt){
  if(window.Khazna&&window.Khazna.shareText){
    try{window.Khazna.shareText(txt,lang);return true}catch(e){}
  }
  if(navigator.share){
    try{await navigator.share({text:txt});return true}
    catch(e){if(e&&e.name==='AbortError')return false}
  }
  await copyText(txt,{label:t('drCopiedPaste')});
  return true;
}

function openDebtRemind(){
  const open=vault.money.filter(m=>m.kind==='debt'&&m.dir==='lya'&&!m.settled);
  if(!open.length){toast(t('drNone'));return}
  const groups=groupByPerson(open);
  const sel=new Set();
  const paint=()=>{
    let html='<div class="sec-note" style="padding:0 2px">'+t('drHint')+'</div>'+
      '<button class="btn btn-ghost" id="dr-all" style="padding:10px">'+(sel.size===open.length?t('drNoneBtn'):t('drAllBtn'))+'</button>';
    groups.forEach((g,gi)=>{
      const allOn=g.items.every(m=>sel.has(m.id));
      html+='<div class="dr-person'+(allOn?' on':'')+'" data-drp="'+gi+'">'+
        '<span class="dr-check">'+ic('check')+'</span>'+
        '<div class="dr-main"><div class="dr-name">'+esc(g.name)+'</div>'+
        (g.items.length>1?'<div class="dr-sub">'+t('drItems',{n:g.items.length})+'</div>':'')+'</div>'+
        '<span class="dr-amt num">'+esc(debtTotalsStr(g.items))+'</span>'+
      '</div>';
      if(g.items.length>1)g.items.forEach(m=>{
        html+='<div class="dr-item'+(sel.has(m.id)?' on':'')+'" data-dri="'+m.id+'">'+
          '<span class="dr-check">'+ic('check')+'</span>'+
          '<div class="dr-main"><div class="dr-sub">'+(m.note?esc(m.note)+' · ':'')+(m.date?fmtDate(m.date):'')+'</div></div>'+
          '<span class="dr-amt num">'+fmtAmt(Number(m.amount)||0)+' '+esc(m.currency||defCur())+'</span>'+
        '</div>';
      });
    });
    html+='<button class="btn btn-flame" id="dr-go"'+(sel.size?'':' disabled')+'>'+ic('share')+' '+t('drGo',{n:sel.size})+'</button>';
    $('#sheet-body').innerHTML=html;
    $('#dr-all').addEventListener('click',()=>{
      if(sel.size===open.length)sel.clear();else open.forEach(m=>sel.add(m.id));
      paint();
    });
    $('#sheet-body').querySelectorAll('[data-drp]').forEach(el=>el.addEventListener('click',()=>{
      const g=groups[Number(el.dataset.drp)];
      const allOn=g.items.every(m=>sel.has(m.id));
      g.items.forEach(m=>{if(allOn)sel.delete(m.id);else sel.add(m.id)});
      paint();
    }));
    $('#sheet-body').querySelectorAll('[data-dri]').forEach(el=>el.addEventListener('click',()=>{
      const id=el.dataset.dri;
      if(sel.has(id))sel.delete(id);else sel.add(id);
      paint();
    }));
    $('#dr-go').addEventListener('click',()=>{
      if(!sel.size)return;
      openDebtRemindPreview(open.filter(m=>sel.has(m.id)));
    });
  };
  openSheet(t('drTitle'),'');
  paint();
}

function openDebtRemindPreview(items){
  const groups=groupByPerson(items);
  const markReminded=async list=>{
    const d=todayISO();
    list.forEach(m=>{m.remindedAt=d});
    await persist();renderTab();
  };
  let html='';
  if(groups.length>1){
    html+='<div class="warn-box">'+ic('users')+'<span>'+t('drMulti',{n:groups.length})+'</span></div>'+
      '<button class="btn btn-ghost" id="dr-combined">'+ic('share')+' '+t('drCombined')+'</button>';
  }
  groups.forEach((g,i)=>{
    html+='<div class="dr-msg" id="dr-msg-'+i+'">'+
      '<div class="dr-msg-h"><b>'+esc(g.name)+'</b><span class="dr-sent" id="dr-sent-'+i+'"></span></div>'+
      '<pre class="dr-text">'+esc(debtReminderText(g))+'</pre>'+
      '<div class="f-row">'+
        '<button class="btn btn-flame" data-drsend="'+i+'">'+ic('share')+' '+t('drSend')+'</button>'+
        '<button class="btn btn-ghost" data-drcopy="'+i+'">'+ic('copy')+' '+t('drCopy')+'</button>'+
      '</div>'+
    '</div>';
  });
  openSheet(groups.length>1?t('drPreviewN',{n:groups.length}):t('drPreview1',{x:groups[0].name}),html);
  const done=i=>{
    const box=$('#dr-msg-'+i),lbl=$('#dr-sent-'+i);
    if(box)box.classList.add('sent');
    if(lbl)lbl.textContent=t('drDone');
  };
  $('#sheet-body').querySelectorAll('[data-drsend]').forEach(b=>b.addEventListener('click',async()=>{
    const i=Number(b.dataset.drsend), g=groups[i];
    if(await shareText(debtReminderText(g))){done(i);markReminded(g.items)}
  }));
  $('#sheet-body').querySelectorAll('[data-drcopy]').forEach(b=>b.addEventListener('click',()=>{
    const i=Number(b.dataset.drcopy);
    copyText(debtReminderText(groups[i]),{label:t('drCopiedPaste')});
    done(i);markReminded(groups[i].items);
  }));
  if($('#dr-combined'))$('#dr-combined').addEventListener('click',async()=>{
    if(await shareText(debtReminderCombined(groups))){
      groups.forEach((g,i)=>done(i));
      markReminded(items);
    }
  });
}

    '<label for="i-title">'+(isGam?t('gTitle'):t('iTitle'))+'</label>'+
    '<input id="i-title" placeholder="'+esc(isGam?t('gTitlePh'):t('iTitlePh'))+'" value="'+esc(m?.title)+'" autocomplete="off">'+
    (isGam?'':'<label for="i-funder">'+t('iFunder')+'</label><input id="i-funder" placeholder="'+esc(t('iFunderPh'))+'" value="'+esc(m?.funder)+'" autocomplete="off">')+
    '<div class="f-row">'+
      '<div><label for="i-monthly">'+(isGam?t('gMonthly'):t('iMonthly'))+'</label><input id="i-monthly" type="number" inputmode="decimal" step="any" min="0" class="ltr num" value="'+esc(m?.monthly)+'" autocomplete="off"></div>'+
      '<div><label for="i-cur">'+t('mCur')+'</label><input id="i-cur" value="'+esc(m?m.currency:defCur())+'" autocomplete="off"></div>'+
    '</div>'+
    '<div class="f-row">'+
      '<div><label for="i-months">'+t('iMonths')+'</label><input id="i-months" type="number" inputmode="numeric" min="1" max="240" class="ltr num" value="'+esc(m?.monthsTotal)+'" autocomplete="off"></div>'+
      '<div><label for="i-due">'+t('iDueDay')+'</label><input id="i-due" type="number" inputmode="numeric" min="1" max="31" class="ltr num" value="'+esc(m?m.dueDay:1)+'" autocomplete="off"></div>'+
    '</div>'+
    '<label for="i-start">'+(isGam?t('gStart'):t('iStart'))+'</label>'+
    '<input id="i-start" type="month" class="ltr num" value="'+esc(m&&isYm(m.startMonth)?m.startMonth:addMonths(monthKey(),1))+'">'+
    '<div class="meter-lbl" id="i-end" style="margin-top:-6px"></div>'+
    '<div class="f-row">'+
      (isGam?'<div><label for="i-turn">'+t('gTurn')+'</label><input id="i-turn" type="number" inputmode="numeric" min="1" max="240" class="ltr num" value="'+esc(m?.myTurn)+'" autocomplete="off"></div>':'')+
      '<div><label for="i-paid">'+t('iPaid')+'</label><input id="i-paid" type="number" inputmode="numeric" min="0" max="240" class="ltr num" value="'+esc(m?m.monthsPaid:0)+'" autocomplete="off"></div>'+
    '</div>'+
    '<label for="i-note">'+t('mNote')+'</label><input id="i-note" value="'+esc(m?.note)+'" autocomplete="off">'+
    '<button class="btn btn-flame" id="i-save">'+(m?t('saveEdit'):t('save'))+'</button>'+
    (m?'<button class="btn btn-danger sheet-del" id="i-del">'+ic('trash')+' '+t('delItemBtn')+'</button>':'')
  );
  /* آخر قسط (وميعاد استلام الجمعية) بيتحسب قدامه وهو بيكتب */
  const updEnd=()=>{
    const el=$('#i-end');if(!el)return;
    const st=$('#i-start').value, mt=Number($('#i-months').value)||0;
    if(!isYm(st)||mt<1){el.textContent='';return}
    let txt=t('endHint',{m:fmtMonth(addMonths(st,mt-1))});
    const tu=$('#i-turn');
    if(tu&&Number(tu.value)>=1){
      const turn=Math.min(mt,Number(tu.value));
      /* حساب القبض لحظة ما يكتب القسط وعدد الشهور */
      const po=gamPayout({monthly:$('#i-monthly').value,monthsTotal:mt,myTurn:turn,
        currency:$('#i-cur').value.trim()||defCur(),startMonth:st});
      txt=(po.gross>0
        ? t('gamPayoutHint',{g:po.grossS,m:fmtMonth(addMonths(st,turn-1)),n:po.netS,c:po.monthlyS})
        : t('payoutHint',{m:fmtMonth(addMonths(st,turn-1))}))+' · '+txt;
    }
    el.textContent=txt;
  };
  ['#i-start','#i-months','#i-turn','#i-monthly','#i-cur'].forEach(sel=>{
    const el=$(sel);if(!el)return;
    el.addEventListener('input',updEnd);el.addEventListener('change',updEnd);
  });
  updEnd();
  $('#i-save').addEventListener('click',async()=>{
    const ti=$('#i-title').value.trim();
    const monthly=Number($('#i-monthly').value);
    const monthsTotal=Number($('#i-months').value);
    const startMonth=$('#i-start').value;
    if(!ti){toast(t('needITitle'));return}
    if(!isGam&&!$('#i-funder').value.trim()){toast(t('needIFunder'));return}
    if(!monthly||monthly<=0){toast(t('needMonthly'));return}
    if(!monthsTotal||monthsTotal<1){toast(t('needMonths'));return}
    if(!isYm(startMonth)){toast(t('needStart'));return}
    const monthsPaid=Math.max(0,Number($('#i-paid').value)||0);
    const data={
      kind, title:ti,
      funder:isGam?'':$('#i-funder').value.trim(),
      monthly, currency:$('#i-cur').value.trim()||defCur(),
      monthsTotal, monthsPaid, startMonth,
      dueDay:Math.min(31,Math.max(1,Number($('#i-due').value)||1)),
      myTurn:isGam?Math.max(1,Number($('#i-turn').value)||1):null,
      note:$('#i-note').value.trim(),
      settled:monthsPaid>=monthsTotal
    };
    if(m)Object.assign(m,data);
    else vault.money.push({id:uid(),createdAt:Date.now(),...data});
    await persist();closeSheet();renderTab();renderTabs();reminderSync();toast(t('saved'));
  });
  if(m)$('#i-del').addEventListener('click',async()=>{
    const yes=await confirmDlg(t('delPwT',{x:m.title}),t('delMsg'),{danger:true,yesLabel:t('delBtn')});
    if(!yes)return;
    vault.money=vault.money.filter(x=>x.id!==m.id);
    await persist();closeSheet();renderTab();renderTabs();reminderSync();toast(t('deleted'));
  });
}

/* -------- فورم المصروف / التحويش -------- */
function openExpForm(id,kind){
  const m=id? vault.money.find(x=>x.id===id) : null;
  const isSav=kind==='saving';
  openSheet(m?(isSav?t('savEdit'):t('expEdit')):(isSav?t('savNew'):t('expNew')),
    '<label for="e-title">'+(isSav?t('sTitle'):t('eTitle'))+'</label>'+
    '<input id="e-title" placeholder="'+esc(isSav?t('sTitlePh'):t('eTitlePh'))+'" value="'+esc(m?.title)+'" autocomplete="off">'+
    '<div class="f-row">'+
      '<div><label for="e-amount">'+t('mAmount')+'</label><input id="e-amount" type="number" inputmode="decimal" step="any" min="0" class="ltr num" value="'+esc(m?.amount)+'" autocomplete="off"></div>'+
      '<div><label for="e-cur">'+t('mCur')+'</label><input id="e-cur" value="'+esc(m?m.currency:defCur())+'" autocomplete="off"></div>'+
    '</div>'+
    '<label for="e-date">'+t('mDate')+'</label><input id="e-date" type="date" class="ltr num" value="'+esc(m?m.date:todayISO())+'">'+
    '<label for="e-note">'+t('mNote')+'</label><input id="e-note" value="'+esc(m?.note)+'" autocomplete="off">'+
    '<button class="btn btn-flame" id="e-save">'+(m?t('saveEdit'):t('save'))+'</button>'+
    (m?'<button class="btn btn-danger sheet-del" id="e-del">'+ic('trash')+' '+t('delItemBtn')+'</button>':'')
  );
  $('#e-save').addEventListener('click',async()=>{
    const ti=$('#e-title').value.trim();
    const amount=Number($('#e-amount').value);
    if(!isSav&&!ti){toast(t('needETitle'));return}
    if(!amount||amount<=0){toast(t('needAmount'));return}
    const data={kind,title:ti||(isSav?t('secSav'):''),amount,currency:$('#e-cur').value.trim()||defCur(),date:$('#e-date').value||todayISO(),note:$('#e-note').value.trim()};
    if(m)Object.assign(m,data);
    else vault.money.push({id:uid(),createdAt:Date.now(),...data});
    await persist();closeSheet();renderTab();renderTabs();toast(t('saved'));
  });
  if(m)$('#e-del').addEventListener('click',async()=>{
    const yes=await confirmDlg(t('delPwT',{x:m.title||fmtAmt(Number(m.amount)||0)}),t('delMsg'),{danger:true,yesLabel:t('delBtn')});
    if(!yes)return;
    vault.money=vault.money.filter(x=>x.id!==m.id);
    await persist();closeSheet();renderTab();renderTabs();toast(t('deleted'));
  });
}

/* ================= أفعال القوائم ================= */
$('#content').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||!vault)return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==='open-pw')openPwForm(id);
  else if(act==='copy-user'){
    const p=vault.passwords.find(x=>x.id===id);
    if(p)copyText(p.email,{label:t('copiedMail')});
  }
  else if(act==='copy-pass'){
    const p=vault.passwords.find(x=>x.id===id);
    if(p)copyText(p.password,{sensitive:true,label:t('copiedPass')});
  }
  else if(act==='open-card')openCardForm(id);
  else if(act==='copy-num'){
    const c2=vault.cards.find(x=>x.id===id);
    if(c2)copyText(c2.number,{sensitive:true,label:t('copiedNum')});
  }
  else if(act==='open-money')openMoneyEdit(id);
  else if(act==='open-goal')openGoalView(id);
  else if(act==='settle'){
    const m=vault.money.find(x=>x.id===id);
    if(m){m.settled=!m.settled;await persist();renderTab();renderTabs();toast(m.settled?t('settledDone'):t('settledBack'))}
  }
  else if(act==='pay-month'){
    const m=vault.money.find(x=>x.id===id);
    if(m){
      const s=instState(m);
      if(s.covered){
        /* تراجع عن آخر دفعة */
        m.monthsPaid=Math.max(0,s.paid-1);
        m.settled=false;
      }else{
        m.monthsPaid=Math.min(s.total||s.paid+1,s.paid+1);
        if(m.monthsPaid>=m.monthsTotal){
          m.settled=true;
          toast(m.kind==='gamiya'?t('gamDone'):t('instDone'));
        }else toast(t('saved'));
      }
      await persist();renderTab();renderTabs();reminderSync();
    }
  }
  else if(act==='open-place')openPlaceForm(id);
  else if(act==='nav-place'){
    const p=vault.places.find(x=>x.id===id);
    if(p)openPlaceGo(p);
  }
  else if(act==='debt-remind'){openDebtRemind()}
  else if(act==='toggle-month'){
    if(expandedMonths.has(id))expandedMonths.delete(id);else expandedMonths.add(id);
    renderTab();
  }
  else if(act==='chpw')openChangePw();
  else if(act==='export')exportBackup();
  else if(act==='import')importBackup(false);
  else if(act==='erase')eraseAll();
  else if(act==='bio')bioToggle();
  else if(act==='notif'){try{window.Khazna.openNotifSettings()}catch(e){}}
  else if(act==='notif-test'){
    let ns='granted';try{ns=window.Khazna.notifStatus()}catch(e){}
    if(ns!=='granted'){toast(t('notifOff'));try{window.Khazna.openNotifSettings()}catch(e){}return}
    try{window.Khazna.testNotification(lang)}catch(e){}
    toast(t('notifTestSent'));
  }
  else if(act==='notif-bg'){try{window.Khazna.requestBatteryExempt()}catch(e){}}
  else if(act==='autobk'){
    if(autoBackupFolder()){
      const yes=await confirmDlg(t('autoOffT'),t('autoOffMsg'),{danger:true,yesLabel:t('autoOffBtn')});
      if(!yes)return;
      try{window.Khazna.clearBackupFolder()}catch(e){}
      vault.settings.autoBackup=false;
      await persist();renderTab();toast(t('saved'));
    }else{
      try{window.Khazna.pickBackupFolder()}catch(e){}
    }
  }
  else if(act==='checkupd'){
    const u=updUrl();
    if(!u){toast(t('updNoUrl'));return}
    updSilent=false;
    window.Khazna.checkUpdate(APP_VCODE,u);
  }
});
$('#sheet-body').addEventListener('click',e=>{
  const b=e.target.closest('[data-act="copy-num"]');if(!b||!vault)return;
  const c2=vault.cards.find(x=>x.id===b.dataset.id);
  if(c2)copyText(c2.number,{sensitive:true,label:t('copiedNum')});
});

/* ================= البصمة: تفعيل/إيقاف ================= */
function bioToggle(){
  const st=bioStatus();
  if(st==='enabled'){
    confirmDlg(t('bioDisableT'),t('bioDisableMsg'),{danger:true,yesLabel:t('bioOff')}).then(yes=>{
      if(yes){try{window.Khazna.biometricDisable()}catch(e){}toast(t('bioDisabled'));renderTab()}
    });
    return;
  }
  if(st!=='ready')return;
  openSheet(t('bioEnableT'),
    '<div class="warn-box">'+ic('finger')+'<span>'+t('bioEnableMsg')+'</span></div>'+
    '<label for="bio-pw">'+t('chOld')+'</label>'+
    '<div class="field"><input id="bio-pw" type="password" class="ltr" autocomplete="off">'+peekBtn('bio-pw')+'</div>'+
    '<div class="gate-err" id="bio-err"></div>'+
    '<button class="btn btn-flame" id="bio-go">'+t('bioEnable')+'</button>'
  );
  $('#bio-go').addEventListener('click',async()=>{
    const pw=$('#bio-pw').value, err=$('#bio-err');
    err.textContent='';
    const btn=$('#bio-go');btn.disabled=true;btn.textContent=t('chWait');
    try{
      const blob=loadBlob();
      const key=await deriveKey(pw,b64Buf(blob.kdf.salt),blob.kdf.iter);
      await decryptVault(key,blob);
      window.Khazna.biometricEnable(pw);
      btn.disabled=false;btn.textContent=t('bioEnable');
    }catch(ex){err.textContent=t('chWrong');btn.disabled=false;btn.textContent=t('bioEnable')}
  });
}

/* ================= إعدادات: أكشنات ================= */
function openChangePw(){
  openSheet(t('setChpw'),
    '<label for="ch-old">'+t('chOld')+'</label>'+
    '<div class="field"><input id="ch-old" type="password" class="ltr" autocomplete="off">'+peekBtn('ch-old')+'</div>'+
    '<label for="ch-new">'+t('chNew')+'</label>'+
    '<div class="field"><input id="ch-new" type="password" class="ltr" autocomplete="new-password">'+peekBtn('ch-new')+'</div>'+
    '<div class="meter"><i id="ch-meter"></i></div><div class="meter-lbl" id="ch-meter-lbl"></div>'+
    '<label for="ch-new2">'+t('chNew2')+'</label>'+
    '<div class="field"><input id="ch-new2" type="password" class="ltr" autocomplete="new-password">'+peekBtn('ch-new2')+'</div>'+
    '<div class="gate-err" id="ch-err"></div>'+
    '<button class="btn btn-flame" id="ch-go">'+t('chGo')+'</button>'
  );
  $('#ch-new').addEventListener('input',e=>{
    const s=strength(e.target.value);
    $('#ch-meter').style.width=s.pct+'%';$('#ch-meter').style.background=s.color;
    $('#ch-meter-lbl').textContent=e.target.value?t('strength')+s.label:'';
  });
  $('#ch-go').addEventListener('click',async()=>{
    const err=$('#ch-err');err.textContent='';
    const old=$('#ch-old').value,nw=$('#ch-new').value,nw2=$('#ch-new2').value;
    if(nw.length<8){err.textContent=t('chShort');return}
    if(nw!==nw2){err.textContent=t('chMismatch');return}
    const btn=$('#ch-go');btn.disabled=true;btn.textContent=t('chWait');
    try{
      const blob=loadBlob();
      const oldKey=await deriveKey(old,b64Buf(blob.kdf.salt),blob.kdf.iter);
      await decryptVault(oldKey,blob);
      const salt=crypto.getRandomValues(new Uint8Array(16));
      const kdf={alg:'PBKDF2-SHA256',iter:KDF_ITER,salt:bufB64(salt)};
      cryptoKey=await deriveKey(nw,salt,KDF_ITER);
      saveBlob(await encryptVault(cryptoKey,vault,kdf));
      if(bioStatus()==='enabled'){try{window.Khazna.biometricEnable(nw)}catch(e){}}
      closeSheet();toast(t('chDone'));
    }catch(ex){err.textContent=t('chWrong');btn.disabled=false;btn.textContent=t('chGo')}
  });
}

async function exportBackup(){
  const blob=loadBlob();if(!blob)return;
  const d=new Date(), name='smoyz-safe-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
  const payload=JSON.stringify(blob);
  const markDone=async()=>{
    if(vault){vault.settings.lastExport=Date.now();await persist();renderTab();renderTabs()}
    toast(t('exported'));
  };
  if(window.Khazna&&window.Khazna.exportBackup){
    window.__khaznaExportDone=async ok=>{
      window.__khaznaExportDone=null;
      if(ok)await markDone();else toast(t('exportCancel'));
    };
    window.Khazna.exportBackup(payload,name);
    return;
  }
  const file=new Blob([payload],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  await markDone();
}

async function applyImportedBackup(txt,fromSetup){
  try{
    const blob=JSON.parse(txt);
    if(!(blob&&blob.v===1&&blob.kdf&&blob.kdf.salt&&blob.kdf.iter&&blob.cipher&&blob.cipher.iv&&blob.cipher.data))
      throw new Error('bad format');
    if(!fromSetup&&loadBlob()){
      const yes=await confirmDlg(t('importT'),t('importMsg'),{danger:true,yesLabel:t('importBtn')});
      if(!yes)return;
    }
    saveBlob(blob);saveGuard({n:0,until:0});
    location.reload();
  }catch(ex){toast(t('importBad'))}
}
function importBackup(fromSetup){
  if(window.Khazna&&window.Khazna.importBackup){
    window.__khaznaImportData=txt=>{window.__khaznaImportData=null;applyImportedBackup(txt,fromSetup)};
    window.Khazna.importBackup();
    return;
  }
  const fi=$('#file-in');
  fi.onchange=async()=>{
    const f=fi.files[0];fi.value='';
    if(!f)return;
    applyImportedBackup(await f.text(),fromSetup);
  };
  fi.click();
}

async function eraseAll(){
  const yes=await confirmDlg(t('eraseT'),t('eraseMsg'),{danger:true,requireText:t('eraseWord'),yesLabel:t('eraseAllBtn')});
  if(!yes)return;
  try{if(window.Khazna&&window.Khazna.biometricDisable)window.Khazna.biometricDisable()}catch(e){}
  localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_GUARD);
  location.reload();
}

boot();
</script>
