<meta charset="utf-8">
<style>
/* ===== Smoyz Safe ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* هوية Smoyz — نيون على أسود بنفسجي (من smoyz-hr/css/tokens.css) */
  --bg:#0A0711;
  --surface:#130E1D;
  --surface-2:#191225;
  --panel:#221930;
  --border-strong:#3D2F58;
  --line:#2B2140;
  --ink:#F0ECF7;
  --muted:#A093B8;
  --faint:#726389;
  --flame:#FF5B14;
  --flame-hi:#FF8A4D;
  --flame-glow:rgba(255,91,20,.35);
  --on-flame:#0A0711;
  --cyan:#2BB8FF;
  --violet:#A62BFF;
  --ok:#45D95B;
  --amber:#F2A93B;
  --danger:#FF5B58;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono",monospace;
  --z-fab:10; --z-nav:20; --z-sheet-bk:30; --z-sheet:31; --z-confirm-bk:40; --z-confirm:41; --z-toast:50;
}
html{font-size:16px}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 55% at 50% -10%, rgba(166,43,255,.16), transparent 70%);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:"Dubai","Cairo","Segoe UI",system-ui,Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
  min-height:100dvh;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;width:100%;font-size:16px;outline:none;
}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--flame);box-shadow:0 0 0 3px rgba(255,91,20,.12)}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
::selection{background:var(--border-strong);color:var(--ink)}
svg{width:22px;height:22px;flex:none}
.ltr{direction:ltr;unicode-bidi:embed;text-align:left}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---- app frame ---- */
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.screen{flex:1;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---- gate screens ---- */
.gate{align-items:center;justify-content:center;padding:32px 24px;text-align:center;gap:0}
.gate-mark{
  width:88px;height:88px;border-radius:50%;
  background:var(--panel);border:1px solid var(--border-strong);
  box-shadow:0 0 28px rgba(255,91,20,.18);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;
}
.gate-mark svg{width:40px;height:40px;color:var(--flame)}
.gate h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em;direction:ltr}
.gate .brand{
  font-size:.66rem;font-weight:600;letter-spacing:.34em;color:var(--faint);
  margin-top:6px;margin-bottom:30px;direction:ltr;
}
.gate form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:start}
.gate label{font-size:.85rem;color:var(--muted)}
.field{position:relative}
/* العين دايمًا على اليمين — عشان بداية الباسورد (من الشمال) متتغطاش */
.field input{padding-right:46px}
.field .peek{
  position:absolute;top:0;right:0;left:auto;height:100%;width:46px;
  display:flex;align-items:center;justify-content:center;color:var(--faint);
}
.field .peek:active{color:var(--ink)}
.btn{
  border-radius:var(--r-md);padding:13px 18px;font-weight:700;font-size:1rem;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:filter .15s, transform .1s, background .15s;
}
.btn:active{transform:scale(.985)}
.btn-flame{background:var(--flame);color:var(--on-flame)}
.btn-flame:hover{background:var(--flame-hi)}
.btn-flame:disabled{filter:saturate(.35) brightness(.75);cursor:default}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.warn-box{
  display:flex;gap:10px;align-items:flex-start;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;font-size:.85rem;color:var(--muted);line-height:1.65;
}
.warn-box svg{color:var(--amber);width:19px;height:19px;margin-top:2px}
.gate .aux{margin-top:22px;font-size:.85rem;color:var(--cyan);text-decoration:underline;text-underline-offset:3px}
.gate .lang-sw{margin-top:12px;font-size:.8rem;color:var(--faint)}
.gate-err{color:var(--danger);font-size:.85rem;min-height:1.2em}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(6px)}40%,80%{transform:translateX(-6px)}}

.meter{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:2px;background:var(--danger);transition:width .25s,background .25s}
.meter-lbl{font-size:.75rem;color:var(--faint);min-height:1em}

/* ---- main ---- */
#scr-main{padding-bottom:76px}
header.bar{
  position:sticky;top:0;z-index:var(--z-nav);
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 18px;display:flex;align-items:center;gap:12px;
}
.bar-mark{width:34px;height:34px;border-radius:10px;background:rgba(255,91,20,.12);color:var(--flame);
  display:flex;align-items:center;justify-content:center}
.bar-mark svg{width:19px;height:19px}
.bar-t{flex:1;line-height:1.15}
.bar-t b{font-size:1.06rem;font-weight:800;display:block;direction:ltr;text-align:start}
.bar-t span{font-size:.6rem;letter-spacing:.3em;color:var(--faint);direction:ltr;display:block;text-align:start}
.bar-lock{width:42px;height:42px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--ink);background:rgba(255,255,255,.07)}
.bar-lock:active{background:rgba(255,255,255,.14)}

main#content{flex:1;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}

.row{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px 14px;cursor:pointer;
}
.row:active{background:var(--surface-2)}
.row-ic{
  width:40px;height:40px;border-radius:12px;background:var(--panel);
  display:flex;align-items:center;justify-content:center;color:var(--flame);flex:none;
}
.row-ic.cy{color:var(--cyan)}
.row-ic.vi{color:var(--violet)}
.row-ic svg{width:19px;height:19px}
.row-main{flex:1;min-width:0}
.row-t{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row-acts{display:flex;gap:4px;flex:none}
.icon-btn{
  width:40px;height:40px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.icon-btn:active{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}

.chip{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--r-sm);
  font-size:.7rem;font-weight:700;background:var(--panel);border:1px solid var(--border-strong);color:var(--ink);
  letter-spacing:.04em;direction:ltr;
}
.chip.meeza{letter-spacing:0}

.search{position:relative}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search input{padding-inline-start:44px;border-radius:var(--r-lg);background:var(--surface)}

/* money */
.mny-sum{
  display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:13px 16px;font-size:.92rem;
}
.mny-sum .pos{color:var(--ok);font-weight:800}
.mny-sum .neg{color:var(--amber);font-weight:800}
.mny-sum small{color:var(--faint);font-weight:400;font-size:.78rem}
.amt-pos{color:var(--ok);font-weight:800}
.amt-neg{color:var(--amber);font-weight:800}
.row.settled{opacity:.45}
.row.settled .row-t{text-decoration:line-through}
.settle-btn{border:1.5px solid var(--line);color:var(--faint)}
.settle-btn.done{border-color:var(--ok);color:var(--ok);background:rgba(69,217,91,.10)}
.sec-h{
  font-size:.78rem;font-weight:700;color:var(--faint);letter-spacing:.02em;
  margin:8px 4px -2px;display:flex;align-items:center;gap:7px;
}
.sec-h svg{width:15px;height:15px}
.pay-banner{
  display:flex;gap:10px;align-items:center;
  background:rgba(242,169,59,.10);border:1px solid rgba(242,169,59,.4);border-radius:var(--r-lg);
  padding:11px 14px;font-size:.86rem;color:var(--amber);font-weight:600;line-height:1.5;
}
.pay-banner svg{width:19px;height:19px;flex:none}
.prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:var(--cyan);border-radius:2px}
.turn-note{color:var(--ok);font-weight:700}

.empty{
  text-align:center;color:var(--faint);padding:56px 24px;display:flex;flex-direction:column;
  align-items:center;gap:12px;font-size:.92rem;line-height:1.7;
}
.empty svg{width:42px;height:42px;opacity:.4}

nav#tabs{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:var(--z-nav);
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
nav#tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 10px;color:var(--faint);font-size:.68rem;font-weight:600;position:relative;
}
nav#tabs button svg{width:21px;height:21px}
nav#tabs button.on{color:var(--flame)}
nav#tabs .dot{position:absolute;top:7px;inset-inline-start:calc(50% - 15px);width:7px;height:7px;border-radius:50%;background:var(--amber)}

#fab{
  position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));z-index:var(--z-fab);
  inset-inline-end:calc(50% - 240px + 18px);
  width:56px;height:56px;border-radius:18px;background:var(--flame);color:var(--on-flame);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 22px var(--flame-glow);
  transition:transform .12s;
}
@media (max-width:500px){#fab{inset-inline-end:18px}}
#fab:active{transform:scale(.93)}
#fab svg{width:25px;height:25px}
#fab.hide{display:none}

.set-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.set-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:start;
  border-bottom:1px solid var(--line);
}
.set-item:last-child{border-bottom:none}
.set-item:active{background:var(--surface-2)}
.set-item svg{width:20px;height:20px;color:var(--muted);flex:none}
.set-item .txt{flex:1;min-width:0}
.set-item .txt b{font-size:.94rem;font-weight:700;display:block}
.set-item .txt small{font-size:.78rem;color:var(--faint)}
.set-item select{width:auto;padding:8px 12px;font-size:.88rem;background:var(--surface-2)}
.set-item.danger .txt b,.set-item.danger svg{color:var(--danger)}
.sec-note{font-size:.8rem;color:var(--faint);line-height:1.8;padding:4px 6px}
.sec-note b{color:var(--muted)}

#sheet-bk{
  position:fixed;inset:0;background:rgba(5,7,8,.66);z-index:var(--z-sheet-bk);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
#sheet-bk.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);
  width:100%;max-width:480px;max-height:90dvh;z-index:var(--z-sheet);
  background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.16,1,.3,1);
}
#sheet.on{transform:translate(-50%,0)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:16px 18px 8px}
.sheet-h b{flex:1;font-size:1.06rem;font-weight:800}
.sheet-body{overflow-y:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet-body label{font-size:.83rem;color:var(--muted);margin-bottom:-6px}
.f-row{display:flex;gap:10px}
.f-row>*{flex:1}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:.92rem;color:var(--muted)}
.seg button.on-pos{background:rgba(69,217,91,.14);color:var(--ok)}
.seg button.on-neg{background:rgba(242,169,59,.14);color:var(--amber)}
.type-pick{display:flex;flex-direction:column;gap:10px}
.type-pick button{
  display:flex;align-items:center;gap:12px;text-align:start;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;
}
.type-pick button:active{border-color:var(--flame)}
.type-pick .row-ic{width:38px;height:38px}
.type-pick b{display:block;font-size:.95rem}
.type-pick small{color:var(--faint);font-size:.78rem}
details.gen{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
details.gen summary{
  list-style:none;cursor:pointer;padding:11px 14px;font-size:.88rem;font-weight:700;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
details.gen summary::-webkit-details-marker{display:none}
details.gen summary svg{width:17px;height:17px}
.gen-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:.85rem}
.gen-row{display:flex;align-items:center;gap:10px;color:var(--muted)}
.gen-row input[type=range]{flex:1;padding:0;background:none;border:none}
.gen-row input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--flame)}
.gen-row label{margin:0;font-size:.85rem}
.sheet-del{margin-top:4px}
.reveal-line{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;
}
.reveal-line .val{flex:1;font-size:.95rem;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.reveal-line .lbl{font-size:.75rem;color:var(--faint);flex:none}

#cf-bk{position:fixed;inset:0;background:rgba(5,7,8,.72);z-index:var(--z-confirm-bk);display:none;align-items:center;justify-content:center;padding:26px}
#cf-bk.on{display:flex}
#cf{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  width:100%;max-width:330px;padding:20px;display:flex;flex-direction:column;gap:12px;
}
#cf b{font-size:1rem}
#cf p{font-size:.87rem;color:var(--muted);line-height:1.7}
#cf .cf-btns{display:flex;gap:10px;margin-top:4px}
#cf .cf-btns .btn{flex:1;padding:11px;font-size:.92rem}

#toast{
  position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,16px);
  background:var(--panel);border:1px solid var(--border-strong);color:var(--ink);
  padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;
  z-index:var(--z-toast);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

.fade-in{animation:fadeIn .26s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div id="app">

  <!-- إنشاء أول مرة -->
  <section class="screen gate" id="scr-setup">
    <div class="gate-mark" id="setup-mark"></div>
    <h1>Smoyz Safe</h1>
    <div class="brand">LET&nbsp;THE&nbsp;GAME&nbsp;BEGIN</div>
    <form id="setup-form" autocomplete="off">
      <label for="su-pw" data-i18n="suLabel"></label>
      <div class="field">
        <input type="password" id="su-pw" class="ltr" autocomplete="new-password" autocapitalize="off" spellcheck="false">
        <button type="button" class="peek" data-peek="su-pw" aria-label="show"></button>
      </div>
      <div class="meter"><i id="su-meter"></i></div>
      <div class="meter-lbl" id="su-meter-lbl"></div>
      <div class="field">
        <input type="password" id="su-pw2" class="ltr" autocomplete="new-password" autocapitalize="off" spellcheck="false">
        <button type="button" class="peek" data-peek="su-pw2" aria-label="show"></button>
      </div>
      <div class="warn-box"><span id="su-warn-ic"></span><span data-i18n="suWarn"></span></div>
      <div class="gate-err" id="su-err"></div>
      <button type="submit" class="btn btn-flame" id="su-btn" data-i18n="suBtn"></button>
    </form>
    <button class="aux" id="su-restore" data-i18n="suRestore"></button>
    <button class="lang-sw" id="lang-sw-setup"></button>
  </section>

  <!-- القفل -->
  <section class="screen gate" id="scr-lock">
    <div class="gate-mark" id="lock-mark"></div>
    <h1>Smoyz Safe</h1>
    <div class="brand" id="lock-brand"></div>
    <form id="lock-form" autocomplete="off">
      <div class="field">
        <input type="password" id="lk-pw" class="ltr" autocomplete="current-password" autocapitalize="off" spellcheck="false">
        <button type="button" class="peek" data-peek="lk-pw" aria-label="show"></button>
      </div>
      <div class="gate-err" id="lk-err"></div>
      <button type="submit" class="btn btn-flame" id="lk-btn" data-i18n="lkBtn"></button>
      <button type="button" class="btn btn-ghost" id="lk-bio" style="display:none"></button>
    </form>
    <button class="aux" id="lk-forgot" data-i18n="lkForgot"></button>
    <button class="lang-sw" id="lang-sw-lock"></button>
  </section>

  <!-- الرئيسية -->
  <section class="screen" id="scr-main">
    <header class="bar">
      <div class="bar-mark" id="bar-mark"></div>
      <div class="bar-t"><b>Smoyz Safe</b><span>SECURE&nbsp;VAULT</span></div>
      <button class="bar-lock" id="btn-lock" aria-label="lock"></button>
    </header>
    <main id="content"></main>
    <button id="fab" aria-label="add"></button>
    <nav id="tabs"></nav>
  </section>

</div>

<div id="sheet-bk"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-h"><b id="sheet-title"></b><button class="icon-btn" id="sheet-x" aria-label="close"></button></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div id="cf-bk">
  <div id="cf">
    <b id="cf-title"></b>
    <p id="cf-msg"></p>
    <input type="text" id="cf-input" style="display:none" autocomplete="off">
    <div class="cf-btns">
      <button class="btn btn-ghost" id="cf-no"></button>
      <button class="btn" id="cf-yes"></button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>
<input type="file" id="file-in" accept=".json,application/json" style="display:none">

<script>
'use strict';
/* ================= إعدادات عامة ================= */
const APP_VERSION='1.7'; // بيتبمب تلقائيًا من release.ps1
const APP_VCODE=8;       // بيتبمب تلقائيًا من release.ps1
const DEFAULT_UPDATE_URL='https://smoyz.github.io/smoyz-safe/version.json';
const LS_KEY='smoyz.safe.v1';
const LS_GUARD='smoyz.safe.guard';
const LS_LANG='smoyz.safe.lang';
/* ترحيل بيانات النسخ القديمة (قبل تغيير الاسم) */
try{
  const _old='vancore.khazna.v1', _oldG='vancore.khazna.guard';
  if(!localStorage.getItem(LS_KEY)&&localStorage.getItem(_old)){
    localStorage.setItem(LS_KEY,localStorage.getItem(_old));
    localStorage.removeItem(_old);localStorage.removeItem(_oldG);
  }
}catch(e){}

if(!document.querySelector('meta[name=viewport]')){
  const m=document.createElement('meta');m.name='viewport';
  m.content='width=device-width, initial-scale=1, viewport-fit=cover';
  document.head.appendChild(m);
}

let lang=localStorage.getItem(LS_LANG)||'ar';
if(!L[lang])lang='ar';
function t(k,vars){
  let s=(L[lang]&&L[lang][k])??L.ar[k]??k;
  if(vars)for(const v in vars)s=s.split('{'+v+'}').join(vars[v]);
  return s;
}
function applyLangStatic(){
  document.documentElement.setAttribute('dir',lang==='ar'?'rtl':'ltr');
  document.documentElement.setAttribute('lang',lang==='ar'?'ar-EG':'en');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  $('#su-pw').placeholder=t('suPh');$('#su-pw2').placeholder=t('suPh2');
  $('#lk-pw').placeholder=t('lkPh');$('#lock-brand').textContent=t('lockBrand');
  $('#lk-bio').textContent=t('lkBio');
  $('#lang-sw-setup').textContent=t('langName');
  $('#lang-sw-lock').textContent=t('langName');
  $('#cf-no').textContent=t('cancel');
  if(window.Khazna&&window.Khazna.setLang){try{window.Khazna.setLang(lang)}catch(e){}}
}
function toggleLang(){
  lang=(lang==='ar')?'en':'ar';
  localStorage.setItem(LS_LANG,lang);
  applyLangStatic();
  if(vault){renderTabs();renderTab()}
}

/* ================= تشفير ================= */
const enc=new TextEncoder(), dec=new TextDecoder();
function bufB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function b64Buf(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
const KDF_ITER=600000;
async function deriveKey(password,salt,iter){
  const km=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']
  );
}
async function encryptVault(key,obj,kdf){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return {v:1,kdf,cipher:{alg:'AES-256-GCM',iv:bufB64(iv),data:bufB64(ct)}};
}
async function decryptVault(key,blob){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64Buf(blob.cipher.iv)},key,b64Buf(blob.cipher.data));
  return JSON.parse(dec.decode(pt));
}

/* ================= قوة + توليد ================= */
function strength(pw){
  if(!pw) return {bits:0,label:'',color:'var(--danger)',pct:0};
  let pool=0;
  if(/[a-z]/.test(pw))pool+=26;
  if(/[A-Z]/.test(pw))pool+=26;
  if(/[0-9]/.test(pw))pool+=10;
  if(/[^a-zA-Z0-9]/.test(pw))pool+=32;
  const bits=Math.round(pw.length*Math.log2(pool||1));
  let label,color;
  if(bits<45){label=t('sWeak');color='var(--danger)'}
  else if(bits<70){label=t('sMid');color='var(--amber)'}
  else if(bits<95){label=t('sStrong');color='var(--ok)'}
  else{label=t('sPerfect');color='var(--ok)'}
  return {bits,label,color,pct:Math.min(100,Math.round(bits/110*100))};
}
function randInt(max){
  const lim=Math.floor(0x100000000/max)*max;
  const a=new Uint32Array(1);
  do{crypto.getRandomValues(a)}while(a[0]>=lim);
  return a[0]%max;
}
function genPassword(len,useUpper,useDigits,useSymbols){
  const lower='abcdefghijkmnopqrstuvwxyz';
  const upper='ABCDEFGHJKLMNPQRSTUVWXYZ';
  const digits='23456789';
  const symbols='!@#$%^&*-_=+?';
  let all=lower;const must=[lower];
  if(useUpper){all+=upper;must.push(upper)}
  if(useDigits){all+=digits;must.push(digits)}
  if(useSymbols){all+=symbols;must.push(symbols)}
  const out=[];
  must.forEach(set=>out.push(set[randInt(set.length)]));
  while(out.length<len)out.push(all[randInt(all.length)]);
  for(let i=out.length-1;i>0;i--){const j=randInt(i+1);[out[i],out[j]]=[out[j],out[i]]}
  return out.slice(0,len).join('');
}

function guardWait(){
  const g=loadGuard();
  return Math.max(0,Math.ceil((g.until-Date.now())/1000));
}
let guardTicker=null;
function tickGuard(){
  clearInterval(guardTicker);
  const btn=$('#lk-btn');
  const upd=()=>{
    const w=guardWait();
    if(w>0){btn.disabled=true;btn.textContent=t('lkWait',{n:w})}
    else{btn.disabled=false;btn.textContent=t('lkBtn');clearInterval(guardTicker)}
  };
  upd();guardTicker=setInterval(upd,1000);
}
async function unlockWith(pw,fromBio){
  if(guardWait()>0&&!fromBio)return;
  const err=$('#lk-err'), btn=$('#lk-btn');
  err.textContent='';
  btn.disabled=true;btn.innerHTML='<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+P.loader+'</svg> '+t('lkOpening');
  try{
    const blob=loadBlob();
    const key=await deriveKey(pw,b64Buf(blob.kdf.salt),blob.kdf.iter);
    vault=await decryptVault(key,blob);
    cryptoKey=key;
    if(!vault.settings)vault.settings={autolockMin:3,lastExport:0};
    vault.money.forEach(m=>{if(!m.kind)m.kind='debt'});
    saveGuard({n:0,until:0});
    $('#lk-pw').value='';
    btn.disabled=false;btn.textContent=t('lkBtn');
    openMain();
  }catch(ex){
    const g=loadGuard();g.n++;
    if(g.n>=3)g.until=Date.now()+Math.min(5*Math.pow(2,g.n-3),300)*1000;
    saveGuard(g);
    err.textContent=fromBio? t('bioFailed') : t('lkWrong')+(g.n>=3?t('lkDelay'):'');
    $('#lock-form').classList.add('shake');
    setTimeout(()=>$('#lock-form').classList.remove('shake'),450);
    btn.disabled=false;btn.textContent=t('lkBtn');
    tickGuard();
  }
}

/* -------- الفلوس -------- */
function moneyTotals(){
  const tt={};
  vault.money.filter(m=>m.kind==='debt'&&!m.settled).forEach(m=>{
    const cur=m.currency||defCur();
    tt[cur]=tt[cur]||{pos:0,neg:0};
    if(m.dir==='lya')tt[cur].pos+=Number(m.amount)||0;
    else tt[cur].neg+=Number(m.amount)||0;
  });
  return tt;
}
function instRow(m){
  const mk=monthKey();
  const paidThis=m.lastPaidMonth===mk;
  const isGam=m.kind==='gamiya';
  const cycle=(m.monthsPaid||0)+1;
  const turn=isGam&&!m.settled&&cycle===Number(m.myTurn||0);
  const pct=Math.min(100,Math.round(((m.monthsPaid||0)/(m.monthsTotal||1))*100));
  let sub=esc(m.funder||'')+(m.funder?' · ':'')+fmtAmt(Number(m.monthly)||0)+' '+esc(m.currency||defCur())+t('perMonth')+
    ' · '+t('monthsProg',{a:m.monthsPaid||0,b:m.monthsTotal||0})+
    (m.dueDay?' · '+t('dueDayS',{n:m.dueDay}):'');
  if(turn)sub+=' · <span class="turn-note">'+t('turnNow')+'</span>';
  return '<div class="row'+(m.settled?' settled':'')+'" data-act="open-money" data-id="'+m.id+'">'+
    '<button class="icon-btn settle-btn'+(paidThis?' done':'')+'" data-act="pay-month" data-id="'+m.id+'" aria-label="'+t('payThis')+'">'+ic('check')+'</button>'+
    '<div class="row-main"><div class="row-t">'+esc(m.title)+'</div>'+
    '<div class="row-s">'+sub+'</div>'+
    '<div class="prog"><i style="width:'+pct+'%"></i></div></div>'+
    '<div class="row-ic '+(isGam?'vi':'cy')+'" style="width:34px;height:34px">'+ic(isGam?'users':'cal')+'</div>'+
  '</div>';
}
function renderMoney(c){
  const pend=pendingPayments();
  const tt=moneyTotals();
  const curs=Object.keys(tt);
  let html='';
  if(pend>0)html+='<div class="pay-banner">'+ic('bell')+'<span>'+t('payBanner',{n:pend})+'</span></div>';
  if(curs.length){
    html+='<div class="mny-sum num">'+curs.map(cur=>
      '<span><small>'+t('forYou')+'&nbsp;</small><span class="pos">'+fmtAmt(tt[cur].pos)+' '+esc(cur)+'</span></span>'+
      '<span><small>'+t('youOwe')+'&nbsp;</small><span class="neg">'+fmtAmt(tt[cur].neg)+' '+esc(cur)+'</span></span>'
    ).join('')+'</div>';
  }
  const debts=vault.money.filter(m=>m.kind==='debt').sort((a,b)=>(a.settled?1:0)-(b.settled?1:0)||(b.date||'').localeCompare(a.date||''));
  const insts=vault.money.filter(m=>m.kind==='installment').sort((a,b)=>(a.settled?1:0)-(b.settled?1:0));
  const gams=vault.money.filter(m=>m.kind==='gamiya').sort((a,b)=>(a.settled?1:0)-(b.settled?1:0));
  if(!debts.length&&!insts.length&&!gams.length){
    c.innerHTML='<div class="empty">'+ic('cash')+'<span>'+t('moneyEmpty')+'</span></div>';
    return;
  }
  if(insts.length)html+='<div class="sec-h">'+ic('cal')+t('secInst')+'</div>'+insts.map(instRow).join('');
  if(gams.length)html+='<div class="sec-h">'+ic('users')+t('secGam')+'</div>'+gams.map(instRow).join('');
  if(debts.length){
    html+='<div class="sec-h">'+ic('cash')+t('secDebts')+'</div>'+debts.map(m=>{
      const pos=m.dir==='lya';
      return '<div class="row'+(m.settled?' settled':'')+'" data-act="open-money" data-id="'+m.id+'">'+
        '<button class="icon-btn settle-btn'+(m.settled?' done':'')+'" data-act="settle" data-id="'+m.id+'" aria-label="'+t('settledDone')+'">'+ic('check')+'</button>'+
        '<div class="row-main"><div class="row-t">'+esc(m.person)+'</div>'+
        '<div class="row-s">'+(pos?t('forYou'):t('youOwe'))+(m.date?' · '+fmtDate(m.date):'')+(m.note?' · '+esc(m.note):'')+'</div></div>'+
        '<span class="num '+(pos?'amt-pos':'amt-neg')+'" style="font-size:1.02rem">'+(pos?'':'−')+fmtAmt(Number(m.amount)||0)+' <small style="font-weight:400;font-size:.72rem">'+esc(m.currency||defCur())+'</small></span>'+
      '</div>';
    }).join('');
  }
  c.innerHTML=html;
}

      '<div><label for="i-cur">'+t('mCur')+'</label><input id="i-cur" value="'+esc(m?m.currency:defCur())+'" autocomplete="off"></div>'+
    '</div>'+
    '<div class="f-row">'+
      '<div><label for="i-months">'+t('iMonths')+'</label><input id="i-months" type="number" inputmode="numeric" min="1" max="240" class="ltr num" value="'+esc(m?.monthsTotal)+'" autocomplete="off"></div>'+
      '<div><label for="i-due">'+t('iDueDay')+'</label><input id="i-due" type="number" inputmode="numeric" min="1" max="31" class="ltr num" value="'+esc(m?m.dueDay:1)+'" autocomplete="off"></div>'+
    '</div>'+
    '<div class="f-row">'+
      (isGam?'<div><label for="i-turn">'+t('gTurn')+'</label><input id="i-turn" type="number" inputmode="numeric" min="1" max="240" class="ltr num" value="'+esc(m?.myTurn)+'" autocomplete="off"></div>':'')+
      '<div><label for="i-paid">'+t('iPaid')+'</label><input id="i-paid" type="number" inputmode="numeric" min="0" max="240" class="ltr num" value="'+esc(m?m.monthsPaid:0)+'" autocomplete="off"></div>'+
    '</div>'+
    '<label for="i-note">'+t('mNote')+'</label><input id="i-note" value="'+esc(m?.note)+'" autocomplete="off">'+
    '<button class="btn btn-flame" id="i-save">'+(m?t('saveEdit'):t('save'))+'</button>'+
    (m?'<button class="btn btn-danger sheet-del" id="i-del">'+ic('trash')+' '+t('delItemBtn')+'</button>':'')
  );
  $('#i-save').addEventListener('click',async()=>{
    const ti=$('#i-title').value.trim();
    const monthly=Number($('#i-monthly').value);
    const monthsTotal=Number($('#i-months').value);
    if(!ti){toast(t('needITitle'));return}
    if(!isGam&&!$('#i-funder').value.trim()){toast(t('needIFunder'));return}
    if(!monthly||monthly<=0){toast(t('needMonthly'));return}
    if(!monthsTotal||monthsTotal<1){toast(t('needMonths'));return}
    const monthsPaid=Math.max(0,Number($('#i-paid').value)||0);
    const data={
      kind, title:ti,
      funder:isGam?'':$('#i-funder').value.trim(),
      monthly, currency:$('#i-cur').value.trim()||defCur(),
      monthsTotal, monthsPaid,
      dueDay:Math.min(31,Math.max(1,Number($('#i-due').value)||1)),
      myTurn:isGam?Math.max(1,Number($('#i-turn').value)||1):null,
      note:$('#i-note').value.trim(),
      settled:monthsPaid>=monthsTotal
    };
    if(m)Object.assign(m,data);
    else vault.money.push({id:uid(),lastPaidMonth:null,createdAt:Date.now(),...data});
    await persist();closeSheet();renderTab();renderTabs();reminderSync();toast(t('saved'));
  });
  if(m)$('#i-del').addEventListener('click',async()=>{
    const yes=await confirmDlg(t('delPwT',{x:m.title}),t('delMsg'),{danger:true,yesLabel:t('delBtn')});
    if(!yes)return;
    vault.money=vault.money.filter(x=>x.id!==m.id);
    await persist();closeSheet();renderTab();renderTabs();reminderSync();toast(t('deleted'));
  });
}

/* ================= أفعال القوائم ================= */
$('#content').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||!vault)return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==='open-pw')openPwForm(id);
  else if(act==='copy-user'){
    const p=vault.passwords.find(x=>x.id===id);
    if(p)copyText(p.email,{label:t('copiedMail')});
  }
  else if(act==='copy-pass'){
    const p=vault.passwords.find(x=>x.id===id);
    if(p)copyText(p.password,{sensitive:true,label:t('copiedPass')});
  }
  else if(act==='open-card')openCardForm(id);
  else if(act==='copy-num'){
    const c2=vault.cards.find(x=>x.id===id);
    if(c2)copyText(c2.number,{sensitive:true,label:t('copiedNum')});
  }
  else if(act==='open-money')openMoneyEdit(id);
  else if(act==='settle'){
    const m=vault.money.find(x=>x.id===id);
    if(m){m.settled=!m.settled;await persist();renderTab();renderTabs();toast(m.settled?t('settledDone'):t('settledBack'))}
  }
  else if(act==='pay-month'){
    const m=vault.money.find(x=>x.id===id);
    if(m){
      const mk=monthKey();
      if(m.lastPaidMonth===mk){
        m.monthsPaid=Math.max(0,(m.monthsPaid||0)-1);
        m.lastPaidMonth=null;
        m.settled=false;
      }else{
        m.monthsPaid=(m.monthsPaid||0)+1;
        m.lastPaidMonth=mk;
        if(m.monthsPaid>=m.monthsTotal){
          m.settled=true;
          toast(m.kind==='gamiya'?t('gamDone'):t('instDone'));
        }else toast(t('saved'));
      }
      await persist();renderTab();renderTabs();reminderSync();
    }
  }
  else if(act==='chpw')openChangePw();
  else if(act==='export')exportBackup();
  else if(act==='import')importBackup(false);
  else if(act==='erase')eraseAll();
  else if(act==='bio')bioToggle();
  else if(act==='checkupd'){
    const u=updUrl();
    if(!u){toast(t('updNoUrl'));return}
    updSilent=false;
    window.Khazna.checkUpdate(APP_VCODE,u);
  }
});
$('#sheet-body').addEventListener('click',e=>{
  const b=e.target.closest('[data-act="copy-num"]');if(!b||!vault)return;
  const c2=vault.cards.find(x=>x.id===b.dataset.id);
  if(c2)copyText(c2.number,{sensitive:true,label:t('copiedNum')});
});

/* ================= البصمة: تفعيل/إيقاف ================= */
function bioToggle(){
  const st=bioStatus();
  if(st==='enabled'){
    confirmDlg(t('bioDisableT'),t('bioDisableMsg'),{danger:true,yesLabel:t('bioOff')}).then(yes=>{
      if(yes){try{window.Khazna.biometricDisable()}catch(e){}toast(t('bioDisabled'));renderTab()}
    });
    return;
  }
  if(st!=='ready')return;
  openSheet(t('bioEnableT'),
    '<div class="warn-box">'+ic('finger')+'<span>'+t('bioEnableMsg')+'</span></div>'+
    '<label for="bio-pw">'+t('chOld')+'</label>'+
    '<div class="field"><input id="bio-pw" type="password" class="ltr" autocomplete="off">'+peekBtn('bio-pw')+'</div>'+
    '<div class="gate-err" id="bio-err"></div>'+
    '<button class="btn btn-flame" id="bio-go">'+t('bioEnable')+'</button>'
  );
  $('#bio-go').addEventListener('click',async()=>{
    const pw=$('#bio-pw').value, err=$('#bio-err');
    err.textContent='';
    const btn=$('#bio-go');btn.disabled=true;btn.textContent=t('chWait');
    try{
      const blob=loadBlob();
      const key=await deriveKey(pw,b64Buf(blob.kdf.salt),blob.kdf.iter);
      await decryptVault(key,blob);
      window.Khazna.biometricEnable(pw);
      btn.disabled=false;btn.textContent=t('bioEnable');
    }catch(ex){err.textContent=t('chWrong');btn.disabled=false;btn.textContent=t('bioEnable')}
  });
}

/* ================= إعدادات: أكشنات ================= */
function openChangePw(){
  openSheet(t('setChpw'),
    '<label for="ch-old">'+t('chOld')+'</label>'+
    '<div class="field"><input id="ch-old" type="password" class="ltr" autocomplete="off">'+peekBtn('ch-old')+'</div>'+
    '<label for="ch-new">'+t('chNew')+'</label>'+
    '<div class="field"><input id="ch-new" type="password" class="ltr" autocomplete="new-password">'+peekBtn('ch-new')+'</div>'+
    '<div class="meter"><i id="ch-meter"></i></div><div class="meter-lbl" id="ch-meter-lbl"></div>'+
    '<label for="ch-new2">'+t('chNew2')+'</label>'+
    '<div class="field"><input id="ch-new2" type="password" class="ltr" autocomplete="new-password">'+peekBtn('ch-new2')+'</div>'+
    '<div class="gate-err" id="ch-err"></div>'+
    '<button class="btn btn-flame" id="ch-go">'+t('chGo')+'</button>'
  );
  $('#ch-new').addEventListener('input',e=>{
    const s=strength(e.target.value);
    $('#ch-meter').style.width=s.pct+'%';$('#ch-meter').style.background=s.color;
    $('#ch-meter-lbl').textContent=e.target.value?t('strength')+s.label:'';
  });
  $('#ch-go').addEventListener('click',async()=>{
    const err=$('#ch-err');err.textContent='';
    const old=$('#ch-old').value,nw=$('#ch-new').value,nw2=$('#ch-new2').value;
    if(nw.length<8){err.textContent=t('chShort');return}
    if(nw!==nw2){err.textContent=t('chMismatch');return}
    const btn=$('#ch-go');btn.disabled=true;btn.textContent=t('chWait');
    try{
      const blob=loadBlob();
      const oldKey=await deriveKey(old,b64Buf(blob.kdf.salt),blob.kdf.iter);
      await decryptVault(oldKey,blob);
      const salt=crypto.getRandomValues(new Uint8Array(16));
      const kdf={alg:'PBKDF2-SHA256',iter:KDF_ITER,salt:bufB64(salt)};
      cryptoKey=await deriveKey(nw,salt,KDF_ITER);
      saveBlob(await encryptVault(cryptoKey,vault,kdf));
      if(bioStatus()==='enabled'){try{window.Khazna.biometricEnable(nw)}catch(e){}}
      closeSheet();toast(t('chDone'));
    }catch(ex){err.textContent=t('chWrong');btn.disabled=false;btn.textContent=t('chGo')}
  });
}

async function exportBackup(){
  const blob=loadBlob();if(!blob)return;
  const d=new Date(), name='smoyz-safe-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
  const payload=JSON.stringify(blob);
  const markDone=async()=>{
    if(vault){vault.settings.lastExport=Date.now();await persist();renderTab();renderTabs()}
    toast(t('exported'));
  };
  if(window.Khazna&&window.Khazna.exportBackup){
    window.__khaznaExportDone=async ok=>{
      window.__khaznaExportDone=null;
      if(ok)await markDone();else toast(t('exportCancel'));
    };
    window.Khazna.exportBackup(payload,name);
    return;
  }
  const file=new Blob([payload],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  await markDone();
}

async function applyImportedBackup(txt,fromSetup){
  try{
    const blob=JSON.parse(txt);
    if(!(blob&&blob.v===1&&blob.kdf&&blob.kdf.salt&&blob.kdf.iter&&blob.cipher&&blob.cipher.iv&&blob.cipher.data))
      throw new Error('bad format');
    if(!fromSetup&&loadBlob()){
      const yes=await confirmDlg(t('importT'),t('importMsg'),{danger:true,yesLabel:t('importBtn')});
      if(!yes)return;
    }
    saveBlob(blob);saveGuard({n:0,until:0});
    location.reload();
  }catch(ex){toast(t('importBad'))}
}
function importBackup(fromSetup){
  if(window.Khazna&&window.Khazna.importBackup){
    window.__khaznaImportData=txt=>{window.__khaznaImportData=null;applyImportedBackup(txt,fromSetup)};
    window.Khazna.importBackup();
    return;
  }
  const fi=$('#file-in');
  fi.onchange=async()=>{
    const f=fi.files[0];fi.value='';
    if(!f)return;
    applyImportedBackup(await f.text(),fromSetup);
  };
  fi.click();
}

async function eraseAll(){
  const yes=await confirmDlg(t('eraseT'),t('eraseMsg'),{danger:true,requireText:t('eraseWord'),yesLabel:t('eraseAllBtn')});
  if(!yes)return;
  try{if(window.Khazna&&window.Khazna.biometricDisable)window.Khazna.biometricDisable()}catch(e){}
  localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_GUARD);
  location.reload();
}

boot();
</script>
